<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#13282D">
<meta name="referrer" content="no-referrer">
<title>LLM Manager</title>
<style>
  /*
   * Harbor: deep-water background, sand-paper tiles, rust for actions, teal as the quiet second colour.
   * Text on paper uses --ink / --ink-2 (12.2:1 / 5.7:1); status colours have darker "-ink" steps for text.
   */
  :root {
    --harbor: #13282D; --harbor-2: #1B353B; --harbor-3: #24434A; --harbor-line: #2C4B52;
    --on-harbor: #EDE3D1; --on-harbor-2: #A9BDBD;
    --paper: #F1E7D6; --paper-2: #E7DAC3; --paper-3: #D9C9AD; --paper-line: #D8C9AE; --field: #FBF6EC;
    --ink: #2B2621; --ink-2: #625850; --ink-3: #857A6E;
    --rust: #D2733A; --rust-strong: #A9501F; --rust-on-dark: #E58B4F; --teal: #3E7F86; --teal-ink: #2D5F64;
    --ok: #4F8A5B; --ok-ink: #34623E; --warn: #C9962E; --warn-ink: #7A5810; --bad: #B8483B; --bad-ink: #9C3A2F;
    /* Chart series, validated as a categorical set on --paper (light): agents keep fixed hues everywhere. */
    --claude: #C25E28; --codex: #2B5DA8; --gemini: #A23B72; --commits: #3E7F86;
    --radius: 18px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 1px 0 rgba(0, 0, 0, .22), 0 10px 26px rgba(0, 0, 0, .26);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--on-harbor);
    background: radial-gradient(140% 55% at 50% -12%, #21434A 0%, transparent 62%), var(--harbor);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  svg.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.logo { width: 18px; height: 18px; flex: none; fill: currentColor; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(19, 40, 45, .9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--harbor-line);
  }
  .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--rust); color: var(--harbor); }
  .mark svg.icon { width: 20px; height: 20px; stroke-width: 2.2; }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .title .status { font-size: 12px; color: var(--on-harbor-2); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; cursor: pointer;
    color: var(--on-harbor); background: var(--harbor-2); border: 1px solid var(--harbor-line);
  }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn.unlocked { color: #8CC59A; }
  .spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .4; } }
  .tabs { flex-basis: 100%; display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--harbor-2); border: 1px solid var(--harbor-line); }
  .tabs button { flex: 1; min-height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--on-harbor-2); font-size: 14px; font-weight: 650; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); }

  main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 48px; }
  .tab { display: grid; gap: 14px; min-width: 0; }
  #tab-repo, #tab-schedule, #tab-usage { max-width: 760px; margin: 0 auto; width: 100%; }

  /* ---------- paper surfaces ---------- */
  .panel, .tile, .list-card, dialog { background: var(--paper); color: var(--ink); color-scheme: light; }
  .panel { border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .panel h2, .panel-head h2 { margin: 0; font-size: 12px; font-weight: 750; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .panel-sub { font-size: 12.5px; color: var(--ink-2); }
  .muted { color: var(--ink-2); font-size: 13px; }

  /* ---------- repository tiles ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
  .tile {
    position: relative; border-radius: var(--radius); padding: 12px 12px 10px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: transform .15s ease;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile:focus-within { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  .tile-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 30px; }
  .badge { width: 30px; height: 30px; border-radius: 9px; background: var(--paper-2); color: var(--ink); display: grid; place-items: center; flex: none; }
  .badge.big { width: 42px; height: 42px; border-radius: 12px; }
  .badge.big svg.logo, .badge.big svg.icon { width: 24px; height: 24px; }
  .badge .letters { font-size: 10px; font-weight: 800; letter-spacing: .02em; }
  .badge.big .letters { font-size: 13px; }
  .tile-name { margin: 0; font-size: 16px; line-height: 1.2; font-weight: 750; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .tile-open { all: unset; cursor: pointer; }
  .tile-open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .tile-owner { font-size: 12px; color: var(--ink-2); margin-top: -6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-desc {
    margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); min-height: 4.2em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tile-desc.missing { font-style: italic; }
  .cell { border-top: 1px solid var(--paper-line); padding-top: 7px; display: grid; gap: 4px; min-width: 0; }
  .cell > * { min-width: 0; }
  .cell-label { font-size: 10.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
  .cell-note { font-size: 12.5px; color: var(--ink-2); min-height: 38px; }
  .pr-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .pr-num { font-weight: 750; font-variant-numeric: tabular-nums; font-size: 14px; }
  .pr-title { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who {
    width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 8.5px; font-weight: 800; letter-spacing: .02em;
    display: inline-grid; place-items: center; flex: none; text-transform: uppercase;
  }
  .agent-mark { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; color: var(--ink); }
  .agent-mark svg.logo { width: 17px; height: 17px; }
  .agent-mark svg.icon { width: 17px; height: 17px; stroke-width: 2.4; }
  .ci { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; color: #fff; }
  .ci svg.icon { width: 11px; height: 11px; stroke-width: 3.2; }
  .ci.success { background: var(--ok); } .ci.failure { background: var(--bad); } .ci.pending { background: var(--warn); }
  .week { display: flex; gap: 16px; min-height: 38px; }
  .week b { display: block; font-size: 20px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .week span { font-size: 11.5px; color: var(--ink-2); }
  .tile-link {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; margin-top: auto;
    border-top: 1px solid var(--paper-line); padding: 8px 0 1px; min-height: 34px;
    font-size: 13px; font-weight: 700; color: var(--rust-strong); text-decoration: none;
  }
  .tile-link svg.icon { width: 14px; height: 14px; margin-left: auto; }
  .tile-link.none { color: var(--ink-2); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 750; padding: 2px 8px; border-radius: 999px; background: rgba(62, 127, 134, .16); color: var(--teal-ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: pulse 2s ease-in-out infinite; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); max-width: 100%; min-width: 0;
    background: var(--paper-2); border: 1px solid var(--paper-line); border-radius: 999px; padding: 3px 9px; text-decoration: none;
  }
  .chip svg.icon { width: 13px; height: 13px; }
  .chip svg.logo { width: 13px; height: 13px; }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.mono .t { font-family: var(--mono); }
  .chip.ok { color: var(--ok-ink); background: rgba(79, 138, 91, .14); border-color: rgba(79, 138, 91, .35); }
  .chip.warn { color: var(--warn-ink); background: rgba(201, 150, 46, .18); border-color: rgba(201, 150, 46, .45); }
  .chip.bad { color: var(--bad-ink); background: rgba(184, 72, 59, .12); border-color: rgba(184, 72, 59, .35); }
  .chip.running, .chip.live { color: var(--teal-ink); background: rgba(62, 127, 134, .16); border-color: rgba(62, 127, 134, .4); }
  .chip.running svg.icon { animation: spin 1.2s linear infinite; }
  .chip.agent { color: var(--ink); }

  /* ---------- repository detail ---------- */
  .back { all: unset; display: inline-flex; align-items: center; gap: 6px; color: var(--on-harbor); font-weight: 650; cursor: pointer; padding: 4px 2px; justify-self: start; }
  .back:focus-visible { outline: 3px solid var(--rust-on-dark); }
  .repo-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .repo-title h1 { margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -.015em; overflow-wrap: anywhere; }
  .repo-title .tile-owner { margin: 0; }
  .repo-desc { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; }
  .repo-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .repo-stats div { background: var(--paper-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
  .repo-stats b { display: block; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .repo-stats span { font-size: 11.5px; color: var(--ink-2); }
  .repo-head .chips { margin-top: 12px; }
  .forge-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-weight: 700; font-size: 14px; color: var(--rust-strong); text-decoration: none; }

  .thread { display: grid; gap: 10px; }
  .thread-empty { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .bubble { border-radius: 16px; padding: 10px 12px; overflow-wrap: anywhere; min-width: 0; }
  .bubble.me { justify-self: end; max-width: min(88%, 560px); background: var(--harbor-2); color: var(--on-harbor); border-bottom-right-radius: 5px; }
  .bubble.me .text { white-space: pre-wrap; font-size: 14px; }
  .bubble.me .meta { color: var(--on-harbor-2); text-align: right; }
  .bubble.agent { justify-self: start; width: min(92%, 560px); background: var(--paper-2); border-bottom-left-radius: 5px; display: grid; gap: 6px; }
  .bubble .meta { font-size: 11.5px; color: var(--ink-2); }
  .bubble .who-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 750; font-size: 13.5px; }
  .bubble .who-row .grow { flex: 1; }
  .bubble.agent .text { font-size: 13.5px; white-space: pre-wrap; }
  .bubble .err { color: var(--bad-ink); font-size: 13px; white-space: pre-wrap; }
  .stages { display: flex; gap: 4px; flex-wrap: wrap; }
  .stage { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--paper); color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
  .stage svg.icon { width: 11px; height: 11px; stroke-width: 3; }
  .stage.done { color: var(--ok-ink); } .stage.failed { color: var(--bad-ink); } .stage.active { color: var(--teal-ink); }
  .stage.active svg.icon { animation: spin 1.2s linear infinite; }

  .composer { display: grid; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--paper-line); }
  .agent-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .agent-pick button {
    display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px 0 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--paper-line); background: var(--field); color: var(--ink); font-size: 14px; font-weight: 650;
  }
  .agent-pick button .agent-mark { color: inherit; }
  .agent-pick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .composer textarea {
    width: 100%; min-height: 92px; resize: vertical; border-radius: 14px; border: 1px solid var(--paper-line);
    background: var(--field); color: var(--ink); padding: 11px 12px; font: inherit; font-size: 15px;
  }
  .composer .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toggle { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); flex: 1 1 220px; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--rust-strong); margin: 1px 0 0; flex: none; }
  .send {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; margin-left: auto;
    border: 0; border-radius: 12px; background: var(--rust-strong); color: #FFF8EE; font-weight: 750; cursor: pointer;
  }
  .send:disabled { opacity: .55; cursor: default; }
  .send:active:not(:disabled) { transform: scale(.98); }
  .composer-hint { margin: 0; font-size: 12.5px; color: var(--ink-2); }

  .wt { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 12px; padding: 12px 0; border-top: 1px solid var(--paper-line); }
  .wt > * { min-width: 0; }
  .wt:first-child { border-top: 0; padding-top: 2px; }
  .bar { border-radius: 4px; background: var(--paper-3); grid-row: span 3; }
  .bar.ok { background: var(--ok); } .bar.warn { background: var(--warn); } .bar.bad { background: var(--bad); }
  .bar.live { background: var(--teal); animation: pulse 2s ease-in-out infinite; }
  .wt-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .branch { font-family: var(--mono); font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wt-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 5px; }
  .wt-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .wt-meta svg.icon { width: 12px; height: 12px; }
  .wt .chips { padding-top: 6px; }
  .attach { margin-top: 8px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; background: var(--harbor); border-radius: 10px; }
  .attach code { font-family: var(--mono); font-size: 12.5px; color: #9FD3D8; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
  .attach button { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--harbor-line); background: var(--harbor-2); color: var(--on-harbor); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .ended { margin-top: 6px; font-size: 12px; color: var(--ink-2); }
  .publish { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .publish .note { font-size: 12px; color: var(--ink-2); flex-basis: 100%; }
  .codex-start { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--paper-line); }
  .codex-start .muted { flex: 1 1 200px; }

  .pr-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--paper-line); color: inherit; text-decoration: none; }
  .pr-row:first-child { border-top: 0; padding-top: 2px; }
  .state { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .state svg.icon { width: 14px; height: 14px; }
  .state.merged { background: var(--teal); } .state.open { background: var(--ok); } .state.closed { background: var(--ink-3); }
  .pr-head { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .pr-name { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-meta { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-tags { display: flex; gap: 5px; align-items: center; }
  .notice { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: rgba(201, 150, 46, .16); color: var(--warn-ink); overflow-wrap: anywhere; }
  .notice svg.icon { margin-top: 2px; }
  .panel details summary { cursor: pointer; list-style: none; font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .panel details summary::-webkit-details-marker { display: none; }
  .paths { display: grid; gap: 6px; margin-top: 10px; }
  .paths div { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .paths div b { font-family: system-ui, sans-serif; font-weight: 700; color: var(--ink); margin-right: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

  .devices { margin: 4px 0 12px; }
  .device { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--paper-line); }
  .device:first-child { border-top: 0; }
  .device div { flex: 1; min-width: 0; }
  .device b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device span { font-size: 12.5px; color: var(--ink-2); }
  dialog a { color: var(--rust-strong); font-weight: 650; }

  /* ---------- buttons and lists ---------- */
  .small-btn {
    min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--paper-line); background: var(--field); color: var(--ink);
    font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none;
  }
  .small-btn.danger { color: var(--bad-ink); }
  .small-btn.go { background: var(--rust-strong); border-color: transparent; color: #FFF8EE; font-weight: 650; }
  .small-btn:disabled { opacity: .55; cursor: default; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .section-head h2 { margin: 0; font-size: 12px; font-weight: 750; color: var(--on-harbor-2); text-transform: uppercase; letter-spacing: .08em; }
  .list-card { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .item { padding: 12px 14px; border-top: 1px solid var(--paper-line); display: grid; gap: 6px; }
  .item:first-child { border-top: 0; }
  .item .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item .name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .meta.with-icon { display: flex; gap: 6px; align-items: flex-start; }
  .meta.with-icon svg.icon { width: 13px; height: 13px; margin-top: 2px; }
  .err { font-size: 12.5px; color: var(--bad-ink); overflow-wrap: anywhere; }
  .actions-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .list-card .empty { padding: 22px 14px; color: var(--ink-2); }
  .empty, .error { text-align: center; color: var(--on-harbor-2); padding: 40px 16px; }
  .error strong { color: #F0A496; display: block; margin-bottom: 6px; font-size: 16px; }
  .panel .error { color: var(--ink-2); padding: 24px 8px; } .panel .error strong { color: var(--bad-ink); }
  .hint-text { font-size: 12.5px; color: var(--ink-2); }
  .sandbox-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .app-banner {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); text-decoration: none;
    color: var(--on-harbor); background: var(--harbor-2); border: 1px solid var(--harbor-line);
  }
  .app-banner div { flex: 1; min-width: 0; }
  .app-banner b { display: block; font-size: 15px; }
  .app-banner span { font-size: 12px; color: var(--on-harbor-2); }

  /* ---------- charts and meters (on paper) ---------- */
  .hero { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 2px; }
  .hero b { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .hero span { color: var(--ink-2); font-size: 13px; }

      agent === "codex" ? icon("terminal") : brand(agent));
  }

  function initials(name) {
    const words = String(name).replace(/\[bot\]$/i, "").split(/[^A-Za-z0-9]+/).filter(Boolean);
    if (!words.length) return "?";
    return (words.length > 1 ? words[0][0] + words[1][0] : words[0].slice(0, 2)).toUpperCase();
  }

  function person(name) {
    if (!name) return null;

    for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return el("span", { class: "who", style: "background:" + AVATARS[h % AVATARS.length], role: "img", "aria-label": name, title: name }, initials(name));
  }

  function ciMark(ci) {

  const prRef = (project, number) => ((FORGE[project.forge] || {}).mr ? "!" : "#") + number;

  // ---------- token ----------
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (_) { return ""; } }
  function setToken(value) { try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch (_) { /* private mode */ } }

  function renderLock() {
    const btn = $("lock");

  }

  function askToken() {
    return new Promise((resolve) => {
      const dialog = $("token-dialog"), input = $("token-input");
      input.value = "";
      dialog.addEventListener("close", () => {
        if (dialog.returnValue === "save" && input.value.trim()) setToken(input.value.trim());
        renderLock();
        resolve(!!getToken() && dialog.returnValue === "save");
      }, { once: true });
      dialog.showModal();
      input.focus();
    });
  }

  /** Not paired and no (valid) token: say why, and offer the token and the open app download. */
  function lockedPanel(refused) {
    status.textContent = "Locked";
    return el("div", { class: "panel" },
      el("div", { class: "panel-head" }, el("h2", null, refused ? "Access token refused" : "Access token needed")),
      el("p", { class: "muted" }, refused
        ? "The saved token was not accepted. It changes if the server's token file is replaced."

        el("button", { class: "small-btn go", type: "button", onclick: async () => { if (await askToken()) refreshActive(); } }, icon("lock"), "Enter token"),

  /** Who has access: the paired devices (revocable), the token as a fallback, and the Android app. */
  async function openAccess() {
    const dialog = $("access-dialog");
    const list = el("div", { class: "devices" }, el("p", { class: "muted" }, "Loading…"));
    const app = lastApp && typeof lastApp.url === "string" && lastApp.url.startsWith("/download/") ? lastApp : null;
    const useToken = async () => {
      dialog.close();
      if (await askToken()) { toast("Token saved"); refreshActive(); }
    };
    const forget = () => {
      setToken("");
      renderLock();
      dialog.close();
      toast("Forgotten in this browser");
    };
    dialog.replaceChildren(
      el("div", { class: "section-head" }, el("h2", null, "Access"),
        el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
      el("p", null, "Devices signed in to the same Tailscale account as the server pair themselves: each gets its own token, " +
        "which only works from that device. Revoking one makes it pair again; to lock a device out, remove it from your Tailscale account."),
      list,
      el("div", { class: "actions-row" },
        el("button", { class: "small-btn", type: "button", onclick: useToken }, icon("lock"), "Use the access token"),
        getToken() ? el("button", { class: "small-btn danger", type: "button", onclick: forget }, icon("x"), "Forget in this browser") : null),
      app ? el("p", { class: "hint-text" }, "Android app " + (app.versionName ? "version " + app.versionName : "") + " · ",
        el("a", { href: app.url, download: "llm-manager.apk" }, "download")) : null);
    dialog.showModal();
    if (!(await ensureAccess())) {
      list.replaceChildren(el("p", { class: "muted" }, "This browser is not paired. " + (pairRefusal || "There is no access token") + "."));
      return;
    }
    const result = await api("/api/devices", { prompt: false });
    if (result.status === 404) { list.replaceChildren(el("p", { class: "muted" }, "Pairing is off on this server; devices use the access token.")); return; }
    if (!result.ok) { list.replaceChildren(el("p", { class: "muted" }, result.body.error || "Could not load devices (" + result.status + ")")); return; }
    const devices = result.body.devices || [];
    const row = (d) => el("div", { class: "device" },
      el("div", null, el("b", null, d.name),
        el("span", null, (d.client === "app" ? "Android app" : "Browser") + (d.os ? " · " + d.os : "") + " · last seen " + relative(d.lastSeenAt || d.pairedAt))),
      d.current ? chip("this browser", "ok", "check")
        : el("button", { class: "small-btn danger", type: "button", onclick: async () => {
            const revoked = await api("/api/devices/" + encodeURIComponent(d.id) + "/revoke", { method: "POST" });
            toast(revoked.ok ? "Revoked " + d.name : (revoked.body.error || "Failed"), !revoked.ok);
            openAccess();
          } }, icon("trash"), "Revoke"));
    list.replaceChildren(...(devices.length ? devices.map(row)
      : [el("p", { class: "muted" }, "No paired devices. This browser uses the access token.")]));
  }

  /**
   * Pairs this browser when the server recognises it, through Tailscale, as one of its owner's
   * devices: the server then hands out a token for this browser alone. Concurrent callers share
   * one attempt. False, with the reason in `pairRefusal`, when the server says no.
   */
  function pair() {
    if (!pairing) {
      pairing = (async () => {
        try {
          const response = await fetch("/api/pair", {
            method: "POST", cache: "no-store",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ client: "web" }),
          });
          const body = await response.json().catch(() => ({}));
          if (response.ok && typeof body.token === "string") {
            setToken(body.token);
            pairRefusal = "";
            renderLock();
            return true;
          }
          pairRefusal = body.error || "Pairing is not available (" + response.status + ")";
          return false;
        } catch (error) {
          pairRefusal = "The server could not be reached (" + error.message + ")";
          return false;
        } finally {
          pairing = null;
        }
      })();
    }
    return pairing;
  }

  /** A token to use: the saved one, or a new one from pairing. */
  async function ensureAccess() {
    return !!getToken() || await pair();
  }

  /**
   * Authenticated JSON request to this origin. Without a token it pairs first; on 401 (a token
   * revoked or replaced) it pairs again, and only then asks for the access token, unless
   * `prompt: false` (background refreshes must never pop a dialog).
   */
  async function api(path, options) {
    const { prompt = true, ...init } = options || {};
    await ensureAccess();
    const send = () => fetch(path, Object.assign({ cache: "no-store" }, init, {
      headers: Object.assign({ Accept: "application/json", Authorization: "Bearer " + getToken() }, init.headers || {}),
    }));
    let response = await send();
    if (response.status === 401) {
      setToken("");
      renderLock();
      if (await pair() || (prompt && await askToken())) response = await send();
    }
    const type = response.headers.get("Content-Type") || "";
    const json = type.includes("application/json");
    const body = json ? await response.json().catch(() => ({})) : {};
    return { ok: response.ok, status: response.status, body, json };
  }

  const postJson = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  // navigator.clipboard needs a secure context, which plain http over the tailnet is not.
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => false);
    const area = el("textarea", { readonly: true, style: "position:fixed;opacity:0" }, text);
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
    area.remove();
    return Promise.resolve(ok);
  }

  // ---------- repository tiles ----------
  function latestCell(p) {
    const ins = p.insights;
    if (!p.forge) return el("div", { class: "cell-note" }, "Local repository");
    if (!ins) return el("div", { class: "cell-note" }, "Reading " + FORGE[p.forge].label + "…");
    const pr = ins.latestMerged;
    if (!pr) return el("div", { class: "cell-note", title: ins.error || "" }, ins.error && !ins.fetchedAt ? "Can't read pull requests" : "None yet");
    return el("div", null,
      el("div", { class: "pr-line" }, el("span", { class: "pr-num" }, prRef(p, pr.number)), person(pr.author), agentMark(pr.agent), ciMark(pr.ci)),
      el("div", { class: "pr-title", title: pr.title }, pr.title));
  }

  function weekCell(p) {
    const ins = p.insights;

    return el("div", { class: "week" },
      el("div", null, el("b", null, ins.mergedLastWeek), el("span", null, "merged")),

  function tile(p) {
    const { owner, repo } = splitName(p.name);

  function renderAppBanner(app) {
    const slot = $("app-slot");

    const mb = (app.sizeBytes / 1048576).toFixed(1);

      el("span", { class: "mark" }, icon("download")),

  function applyProjects(body) {
    lastApp = body.androidApp || null;
    codexAvailable = body.codexAvailable === true;
    projectsCache = body.projects;
    lastAnalytics = body.analytics || null;
    renderAppBanner(body.androidApp);
  }

  async function fetchProjects() {
    const result = await api("/api/projects", { prompt: false });
    if (result.status === 401) return { locked: true };
    // A captive portal answers 200 with HTML; only trust a JSON body of the expected shape.
    if (!result.ok || !result.json) throw new Error("Unexpected response (" + result.status + ")");
    if (!result.body || !Array.isArray(result.body.projects)) throw new Error("Unexpected response shape");
    applyProjects(result.body);
    return { body: result.body };
  }

  async function load() {
    if (inFlight) return;
    if (!(await ensureAccess())) { grid.replaceChildren(lockedPanel(false)); $("app-slot").replaceChildren(); return; }
    inFlight = true;
    spin(true);
    try {
      const result = await fetchProjects();
      if (result.locked) { grid.replaceChildren(lockedPanel(true)); return; }
      const projects = result.body.projects;
      grid.replaceChildren(...(projects.length
        ? projects.map(tile)
        : [el("div", { class: "empty" }, "No git repositories found in the configured folders.")]));
      // Pull request activity is read in the background on the server; look again shortly.
      if (projects.some((p) => p.forge && !p.insights) && insightRetries < 3) {
        insightRetries++;
        setTimeout(() => { if (activeTab === "overview") load(); }, 4000);
      }
      stamp();
    } catch (error) {
      grid.replaceChildren(el("div", { class: "error" }, el("strong", null, "Can't reach the server"), "Is Tailscale connected? " + error.message));
      status.textContent = "Offline";
    } finally {
      inFlight = false;
      spin(false);
    }
  }

  // ---------- repository detail ----------
  function repoHeader(p) {
    const { owner, repo } = splitName(p.name);
    const forge = FORGE[p.forge];
    const link = httpsOnly(p.webUrl || p.gitHubUrl);
    const ins = p.insights && p.insights.fetchedAt ? p.insights : null;
    const branches = p.worktrees.filter((w) => !w.main).length;
    const last = p.worktrees.map((w) => w.lastCommitAt).filter(Boolean).sort().pop() || null;
    return el("section", { class: "panel repo-head" },
      el("div", { class: "repo-title" }, forgeBadge(p.forge, true),
        el("div", { style: "min-width:0" }, owner ? el("div", { class: "tile-owner" }, owner) : null, el("h1", null, repo))),
      p.description ? el("p", { class: "repo-desc" }, p.description) : null,
      el("div", { class: "repo-stats" },
        el("div", null, el("b", null, ins ? ins.mergedLastWeek : "–"), el("span", null, "merged this week")),
        el("div", null, el("b", null, ins ? ins.openCount : "–"), el("span", null, "open pull requests")),
        el("div", null, el("b", null, branches), el("span", null, branches === 1 ? "agent branch" : "agent branches"))),
      el("div", { class: "chips" },
        chip(p.defaultBranch || "unknown", null, "branch", true),
        chip("last commit " + relative(last), null, "clock")),
      link ? el("a", { class: "forge-link", href: link, target: "_blank", rel: "noopener noreferrer" }, "Open on " + (forge ? forge.label : "the forge"), icon("link")) : null);
  }

  function stageChip(run) {
    const look = {
      queued: ["clock", ""], running: ["loader", "active"], succeeded: ["check", "done"], limited: ["alert", "failed"],
      cancelled: ["x", ""], failed: ["alert", "failed"],
    }[run.status] || ["clock", ""];
    return el("span", { class: "stage " + look[1] }, icon(look[0]), STAGE[run.stage]);
  }

  function runStatus(run) {
    switch (run.status) {
      case "queued": return chip(run.notBefore && Date.parse(run.notBefore) > Date.now() ? "waits " + until(run.notBefore) : "queued", null, "clock");
      case "running": return chip("working", "running", "loader");
      case "succeeded": return chip("done", "ok", "check");
      case "limited": return chip(run.resumeScheduled ? "limit · resumes" : "usage limit", "warn", "alert");
      case "cancelled": return chip("cancelled", null, "x");
      default: return chip("failed", "bad", "alert");
    }
  }

  async function cancelRun(run, after) {
    if (!confirm("Cancel this run? Its worktree and branch are kept.")) return;
    const result = await api("/api/runs/" + encodeURIComponent(run.id) + "/cancel", { method: "POST" });
    toast(result.ok ? "Cancelled" : (result.body.error || "Failed"), !result.ok);
    after();
  }

  /** One message and the agent's answer: every run on the same branch (build, review, fix, resumes). */
  function turn(p, runs) {
    const first = runs[0], last = runs[runs.length - 1];
    const latest = (key) => { for (let i = runs.length - 1; i >= 0; i--) if (runs[i][key]) return runs[i][key]; return null; };
    const summary = latest("summary");
    const note = latest("publishNote");
    const active = runs.find((r) => r.status === "queued" || r.status === "running");
    const wt = first.branch ? p.worktrees.find((w) => w.branch === first.branch) : null;
    const pr = wt && wt.publish ? wt.publish.pullRequest : null;
    const prUrl = pr ? httpsOnly(pr.url) : null;
    const reviewer = runs.find((r) => r.stage === "review");
    const live = active && active.status === "running" && active.tmuxSession;
    return [
      el("div", { class: "bubble me" },
        el("div", { class: "text" }, clamp(first.prompt, 800)),
        el("div", { class: "meta" }, fmtTime(first.createdAt))),
      el("div", { class: "bubble agent" },
        el("div", { class: "who-row" }, agentMark(first.agent), AGENT[first.agent].label,
          reviewer ? el("span", { class: "meta" }, "· reviewed by " + AGENT[reviewer.agent].label) : null,
          el("span", { class: "grow" }), runStatus(active || last)),
        runs.length > 1 ? el("div", { class: "stages" }, runs.map(stageChip)) : null,
        summary ? el("div", { class: "text" }, clamp(summary, 700)) : active ? el("div", { class: "meta" }, active.status === "queued" ? "Waiting for a free slot…" : "Working on it…") : null,
        last.status === "failed" && last.error ? el("div", { class: "err" }, clamp(last.error, 400)) : null,
        prUrl
          ? el("div", { class: "publish" }, el("a", { class: "chip " + (pr.state === "merged" || pr.state === "completed" ? "ok" : "running"), href: prUrl, target: "_blank", rel: "noopener noreferrer" },
              icon("pr"), el("span", { class: "t" }, "Pull request " + prRef(p, pr.number) + " · " + pr.state)))
          : note ? el("div", { class: "meta with-icon" }, icon("pr"), note) : null,
        live ? attachBox({ running: true, attachCommand: "tmux attach -t " + active.tmuxSession }) : null,
        el("div", { class: "meta" }, (first.branch ? first.branch + " · " : "") + "updated " + relative(last.finishedAt || last.startedAt || last.createdAt)),
        el("div", { class: "actions-row" },
          el("button", { class: "small-btn", type: "button", onclick: () => openLog(last) }, icon("list"), "Log"),
          active ? el("button", { class: "small-btn danger", type: "button", onclick: () => cancelRun(active, loadRepo) }, icon("x"), "Cancel") : null)),
    ];
  }

  function thread(p) {
    const runs = ((scheduleData && scheduleData.runs) || []).filter((r) => r.projectId === p.id)
      .sort((a, b) => (a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0));
    const groups = new Map();
    for (const r of runs) {
      const key = r.pipelineId || r.branch || r.id;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const turns = [...groups.values()].slice(-8);
    if (!turns.length) {
      return el("p", { class: "thread-empty" }, "No messages yet. Ask an agent below: it works on a new branch of " + splitName(p.name).repo +
        (p.forge ? " and opens a pull request when it's done." : "."));
    }
    return el("div", { class: "thread" }, turns.map((t) => turn(p, t)));
  }

  function savedAgent() { try { return localStorage.getItem(AGENT_KEY) || "claude"; } catch (_) { return "claude"; } }
  function saveAgent(agent) { try { localStorage.setItem(AGENT_KEY, agent); } catch (_) { /* private mode */ } }

  /** The chat box. Built once per repository, so a refresh never wipes what is being typed. */
  function buildComposer(projectId) {
    const state = { agent: savedAgent(), project: null };
    const picker = el("div", { class: "agent-pick", role: "group", "aria-label": "Agent" });
    const text = el("textarea", { rows: "3", "aria-label": "Message to the agent" });
    const review = el("input", { type: "checkbox" });
    const reviewText = el("span");
    const reviewRow = el("label", { class: "toggle" }, review, reviewText);
    const hint = el("p", { class: "composer-hint" });
    const send = el("button", { class: "send", type: "button" }, icon("send"), "Send");
    const available = () => {
      const known = (scheduleData && scheduleData.agents) || {};
      return AGENTS.filter((a) => known[a] !== false);
    };
    const reviewerFor = (agent) => {
      const others = available().filter((a) => a !== agent);
      return others.includes(defaultReviewer(agent)) ? defaultReviewer(agent) : others[0] || null;
    };

    function render() {
      const p = state.project;
      const ok = available();
      if (!ok.includes(state.agent)) state.agent = ok[0] || "claude";
      picker.replaceChildren(...ok.map((a) => el("button", {
        type: "button", "aria-pressed": String(a === state.agent),
        onclick: () => { state.agent = a; saveAgent(a); render(); },
      }, agentMark(a), AGENT[a].pick)));
      text.placeholder = "Ask " + AGENT[state.agent].label + " to change something in " + splitName(p.name).repo + "…";
      const reviewer = reviewerFor(state.agent);
      reviewRow.hidden = !reviewer;
      if (reviewer) reviewText.textContent = "Cross-review first: " + AGENT[reviewer].label + " reviews the change, " + AGENT[state.agent].label + " addresses it";
      hint.textContent = !ok.length
        ? "No coding agent is installed on the server."
        : p.forge
          ? "Works on a new branch. When it's done, the branch is pushed and a pull request is opened on " + FORGE[p.forge].label + "."
          : "This repository has no GitHub, GitLab or Azure DevOps remote, so the work stays on a local branch.";
      send.disabled = !ok.length;
    }

    async function submit() {
      const p = state.project;
      const prompt = text.value.trim();
      if (!prompt) { toast("Write a message first", true); text.focus(); return; }
      const reviewer = review.checked ? reviewerFor(state.agent) : null;
      const request = { projectId: p.id, kind: reviewer ? "pipeline" : "run", agent: state.agent, prompt, publish: !!p.forge, resumeOnLimitReset: true };
      if (reviewer) request.reviewer = reviewer;
      send.disabled = true;
      try {
        const result = await postJson("/api/jobs", request);
        if (!result.ok) { toast(result.body.error || "Failed (" + result.status + ")", true); return; }
        text.value = "";
        review.checked = false;
        toast(AGENT[state.agent].label + " is on it");
        loadRepo();
      } catch (error) {
        toast("Can't reach the server: " + error.message, true);
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener("click", submit);
    text.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) submit(); });
    const node = el("div", { class: "composer" }, picker, text, el("div", { class: "row" }, reviewRow, send), hint);
    return { projectId, node, update: (p) => { state.project = p; render(); } };
  }

  function worktreeState(w) {
    if (w.codex && w.codex.running) return "live";
    if (w.missing || w.changedFiles === null) return "bad";
    return w.changedFiles === 0 ? "ok" : "warn";
  }

  function changesChip(w) {
    if (w.missing) return chip("missing", "bad", "alert");
    if (w.changedFiles === null) return chip("status unknown", "bad", "alert");
    if (w.changedFiles === 0) return chip("clean", "ok", "check");
    return chip(plural(w.changedFiles, "change", "changes"), "warn", "edit");
  }

  /** Columns per day; `series` are stacked bottom-up with a 2px surface gap. */
  function columnChart(days, series, readout, describe) {
    const width = chartWidth(), height = 132, top = 8, bottom = 20, left = 30;
    const plotW = width - left, plotH = height - top - bottom;
    const totals = days.map((_, i) => series.reduce((sum, s) => sum + s.values[i], 0));
    const max = niceMax(Math.max(...totals));
    const band = plotW / days.length, barW = Math.max(2, Math.min(24, band - 2));
    const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, width, height, role: "img" });
    const y = (v) => top + plotH - (v / max) * plotH;
    // Counts are whole numbers: only show a midline when it lands on one.
    for (const tick of max >= 4 && max % 2 === 0 ? [0, max / 2, max] : [0, max]) {
      svg.append(svgEl("line", { x1: left, x2: width, y1: y(tick), y2: y(tick), stroke: "var(--paper-line)", "stroke-width": 1 }));
      const label = svgEl("text", { x: left - 6, y: y(tick) + 3, "text-anchor": "end" });
      label.textContent = compact(tick);
      svg.append(label);
    }
    const highlight = svgEl("rect", { class: "hl", y: top, height: plotH, width: band, x: -band, rx: 4 });
    svg.append(highlight);
    days.forEach((day, i) => {
      const x = left + i * band + (band - barW) / 2;
      let base = top + plotH;
      const visible = series.filter((s) => s.values[i] > 0);
      visible.forEach((s, k) => {
        const h = Math.max(1, (s.values[i] / max) * plotH - (k > 0 ? 2 : 0));
        base -= h + (k > 0 ? 2 : 0);
        svg.append(column(x, base, barW, h, s.color, k === visible.length - 1));
      });
    });
    for (const i of [0, Math.floor((days.length - 1) / 2), days.length - 1]) {
      const label = svgEl("text", { x: left + i * band + band / 2, y: height - 5, "text-anchor": i === 0 ? "start" : i === days.length - 1 ? "end" : "middle" });
      label.textContent = fmtDay(days[i]);
      svg.append(label);
    }
    // Hit target: the whole plot, resolved to the nearest day band.
    const hit = svgEl("rect", { x: left, y: 0, width: plotW, height, fill: "transparent" });
    const resting = readout.textContent;
    const show = (event) => {
      const box = svg.getBoundingClientRect();
      const i = Math.min(days.length - 1, Math.max(0, Math.floor(((event.clientX - box.left) * (width / box.width) - left) / band)));
      highlight.setAttribute("x", left + i * band);
      readout.replaceChildren(el("strong", null, fmtDay(days[i], { weekday: "short", month: "short", day: "numeric" })), " · " + describe(i));
    };
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerleave", () => { highlight.setAttribute("x", -band); readout.textContent = resting; });
    svg.append(hit);
    svg.setAttribute("aria-label", readout.textContent);
    return svg;
  }

  function activityPanel(a) {
    if (!a || !Array.isArray(a.days) || !a.days.length) return null;
    const commits = a.commitsPerDay.reduce((x, y) => x + y, 0);
    const codex = a.codexStartsPerDay.reduce((x, y) => x + y, 0);
    const agents = a.agentRunsPerDay.reduce((x, y) => x + y, 0);

    const commitReadout = el("div", { class: "readout" }, "Tap a day for details");
    const commitChart = commits
      ? columnChart(a.days, [{ values: a.commitsPerDay, color: "var(--commits)" }], commitReadout, (i) => plural(a.commitsPerDay[i], "commit", "commits"))
      : el("div", { class: "muted" }, "No commits in the last " + a.days.length + " days.");

    const sessionReadout = el("div", { class: "readout" }, plural(codex, "Codex session", "Codex sessions") + " · " + plural(agents, "agent run", "agent runs"));
    const sessionChart = codex + agents
      ? columnChart(a.days, [
          { values: a.codexStartsPerDay, color: "var(--codex)" },
          { values: a.agentRunsPerDay, color: "var(--claude)" },
        ], sessionReadout, (i) => plural(a.codexStartsPerDay[i], "Codex session", "Codex sessions") + ", " + plural(a.agentRunsPerDay[i], "agent run", "agent runs"))
      : el("div", { class: "muted" }, "No Codex sessions or agent runs yet.");

    const top = a.busiest.length ? a.busiest[0].commits : 0;
    const rank = a.busiest.length
      ? el("div", { class: "rank" }, a.busiest.map((p) => [
          el("div", { class: "n", title: p.name }, p.name),
          el("div", { class: "track" }, el("div", { class: "fill", style: "width:" + Math.max(3, (p.commits / top) * 100) + "%" })),
          el("div", { class: "v" }, p.commits)]))
      : el("div", { class: "muted" }, "No commits in this window.");

    const rows = a.days.map((d, i) => [d, a.commitsPerDay[i], a.codexStartsPerDay[i], a.agentRunsPerDay[i]]).reverse();
    const table = el("details", { class: "table-details" }, el("summary", null, "Show as table"),
      el("div", { class: "table-wrap" }, el("table", null,
        el("thead", null, el("tr", null, el("th", null, "Day"), el("th", null, "Commits"), el("th", null, "Codex"), el("th", null, "Agent runs"))),
        el("tbody", null, rows.map((r) => el("tr", null, el("td", null, fmtDay(r[0], { weekday: "short", month: "short", day: "numeric" })), el("td", null, r[1]), el("td", null, r[2]), el("td", null, r[3])))))));

    return el("section", { class: "panel" },
      el("h2", null, "Activity · last " + a.days.length + " days"),
      el("div", { class: "hero" }, el("b", null, commits.toLocaleString()), el("span", null, commits === 1 ? "commit across all repositories" : "commits across all repositories")),
      commitReadout, commitChart,
      el("div", { class: "section" }, el("h3", null, "Sessions started per day"),
        el("div", { class: "legend" },
          el("span", null, el("i", { style: "background: var(--codex)" }), "Codex"),
          el("span", null, el("i", { style: "background: var(--claude)" }), "Agent runs")),
        sessionReadout, sessionChart),
      el("div", { class: "section" }, el("h3", null, "Busiest repositories"), rank),
      table);
  }

  function meter(win) {
    const pct = Math.max(0, Math.min(100, win.usedPercent));
    const color = pct >= 90 ? "var(--bad)" : pct >= 70 ? "var(--warn)" : "var(--teal)";
    return el("div", { class: "meter-row" },
      el("span", null, win.label),
      el("div", { class: "meter", role: "meter", "aria-valuenow": String(Math.round(pct)), "aria-valuemin": "0", "aria-valuemax": "100", "aria-label": win.label + " limit used" },
        el("div", { style: "width:" + pct + "%;background:" + color })),
      el("span", { class: "v" }, Math.round(win.usedPercent) + "%"),
      win.resetsAt ? el("span", { class: "r" }, "resets " + until(win.resetsAt) + " · " + fmtTime(win.resetsAt)) : null);
  }

  function agentPanel(key, usage, days) {
    const a = AGENT[key];
    const total = usage.tokensPerDay.reduce((x, y) => x + y, 0);
    const cache = usage.cacheReadsPerDay.reduce((x, y) => x + y, 0);
    const readout = el("div", { class: "readout" }, "Tap a day for details");
    const top = usage.models.length ? usage.models[0].tokens : 0;
    return el("section", { class: "panel" },
      el("div", { class: "agent-title" }, agentMark(key), a.label),
      el("div", { class: "section" }, el("h3", null, "Plan limits"),
        usage.windows.length ? usage.windows.map(meter) : null,
        usage.windowsAsOf ? el("div", { class: "hint-text", style: "margin-top:8px" }, "As of " + relative(usage.windowsAsOf)) : null,
        usage.note ? el("div", { class: "hint-text", style: "margin-top:8px" }, usage.note) : null),
      el("div", { class: "section" }, el("h3", null, "Tokens · last " + days.length + " days"),
        el("div", { class: "hero" }, el("b", null, compact(total)), el("span", null, "tokens" + (cache ? " · " + compact(cache) + " more read from cache" : ""))),
        readout,
        total ? columnChart(days, [{ values: usage.tokensPerDay, color: a.color }], readout, (i) => compact(usage.tokensPerDay[i]) + " tokens")
          : el("div", { class: "muted" }, "No usage recorded in this window.")),
      usage.models.length > 1 ? el("div", { class: "section" }, el("h3", null, "By model"),
        el("div", { class: "rank" }, usage.models.map((m) => [
          el("div", { class: "n", title: m.model }, m.model),
          el("div", { class: "track" }, el("div", { class: "fill", style: "background:" + a.color + ";width:" + Math.max(3, (m.tokens / top) * 100) + "%" })),
          el("div", { class: "v" }, compact(m.tokens))]))) : null);
  }

  function renderUsage(data) {
    lastUsage = data;
    usageTab.replaceChildren(
      activityPanel(lastAnalytics),
      agentPanel("claude", data.claude, data.days), agentPanel("codex", data.codex, data.days),
      data.gemini ? agentPanel("gemini", data.gemini, data.days) : null,
      el("p", { class: "hint-text", style: "color:var(--on-harbor-2)" }, "From local records on the server: Claude Code and Codex session logs, Claude's status line, and Gemini runs started here. Tokens exclude cache reads."));
  }

  async function loadUsage() {
    if (!(await ensureAccess())) { usageTab.replaceChildren(lockedPanel(false)); return; }
    spin(true);
    try {
      const [result, projects] = await Promise.all([api("/api/usage", { prompt: false }), fetchProjects().catch(() => null)]);
      if (result.status === 401 || (projects && projects.locked)) { usageTab.replaceChildren(lockedPanel(true)); return; }
      if (!result.ok || !result.json) throw new Error("Unexpected response (" + result.status + ")");
      renderUsage(result.body);
      stamp();
    } catch (error) {
      usageTab.replaceChildren(el("div", { class: "error" }, el("strong", null, "Couldn't load usage"), error.message));
    } finally {
      spin(false);
    }
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (activeTab === "usage" && lastUsage) renderUsage(lastUsage); }, 150);
  });

  // ---------- start ----------
  $("token-cancel").addEventListener("click", () => $("token-dialog").close("cancel"));
  $("token-save").addEventListener("click", () => $("token-dialog").close("save"));
  $("token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("token-dialog").close("save"); });
  $("logo").append(icon("anchor"));
  $("refresh").append(icon("refresh"));
  $("refresh").addEventListener("click", refreshActive);
  for (const button of document.querySelectorAll(".tabs button")) button.addEventListener("click", () => go(button.dataset.tab === "overview" ? "" : button.dataset.tab));
  $("lock").addEventListener("click", openAccess);
  renderLock();
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshActive(); });
  // Background refresh, but never while a dialog is open or something is being typed.
  setInterval(() => {
    const typing = document.activeElement && ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName);
    if (!document.hidden && !typing && !document.querySelector("dialog[open]")) refreshActive();
  }, REFRESH_MS);
  route();
})();
</script>
</body>
</html>
