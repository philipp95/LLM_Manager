<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<meta name="referrer" content="no-referrer">
<title>LLM Manager</title>
<style>
  :root {
    --bg: #0b0d12; --surface: #12151d; --raised: #191d28; --line: #232938; --line-soft: #1c2130;
    --text: #e8eaf0; --muted: #8a93a6; --faint: #5c6478;
    --accent: #8b7cf6; --accent-2: #5ec4ff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --live: #22d3ee;
    /* Chart series (validated on the card surface): Codex = slot 1, agent runs = slot 2, commits = accent. */
    --series-codex: #3987e5; --series-agent: #d95926; --series-gemini: #199e70; --series-commits: #9085e9; --grid: #232938;
    --radius: 18px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    background: radial-gradient(120% 60% at 50% -10%, rgba(139, 124, 246, .18), transparent 60%), var(--bg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  svg.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header {
    position: sticky; top: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(11, 13, 18, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 18px rgba(139, 124, 246, .35);
  }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .title .status { font-size: 12px; color: var(--muted); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
    color: var(--text); background: var(--surface); border: 1px solid var(--line); cursor: pointer;
  }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn.unlocked { color: var(--ok); }
  .spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { max-width: 760px; margin: 0 auto; padding: 14px 14px 40px; display: grid; gap: 14px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; padding: 10px 10px 9px; min-width: 0; }
  .stat b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .stat i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }

  .card { background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card-head { display: flex; gap: 12px; align-items: center; padding: 14px 14px 10px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center;
    font-weight: 700; font-size: 16px; color: #fff; text-transform: uppercase;
  }
  .names { flex: 1; min-width: 0; }
  .owner { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .repo { font-size: 17px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a.icon-btn { text-decoration: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted);
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
    max-width: 100%; min-width: 0;
  }
  .chip svg.icon { width: 13px; height: 13px; }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.mono .t { font-family: var(--mono); }
  .chip.live { color: #8fbaf2; border-color: rgba(57, 135, 229, .45); background: rgba(57, 135, 229, .12); }
  .chip.agent { color: #f0a07e; border-color: rgba(217, 89, 38, .45); background: rgba(217, 89, 38, .12); }
  .chip.ok { color: var(--ok); border-color: rgba(74, 222, 128, .3); }
  .chip.warn { color: var(--warn); border-color: rgba(251, 191, 36, .35); background: rgba(251, 191, 36, .07); }
  .chip.bad { color: var(--bad); border-color: rgba(248, 113, 113, .35); }

  .wts { border-top: 1px solid var(--line-soft); }
  .wt { display: grid; grid-template-columns: 4px 1fr; gap: 0 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .wt:last-child { border-bottom: 0; }
  .bar { border-radius: 4px; background: var(--faint); grid-row: span 3; }
  .bar.ok { background: var(--ok); } .bar.warn { background: var(--warn); } .bar.bad { background: var(--bad); }
  .bar.live { background: var(--series-codex); box-shadow: 0 0 10px var(--series-codex); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .wt-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .branch { font-family: var(--mono); font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wt-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 5px; }
  .wt-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .wt-meta svg.icon { width: 12px; height: 12px; }
  .wt .chips { padding: 6px 0 0; }

  .attach {
    margin-top: 8px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px;
    background: #07090d; border: 1px solid rgba(57, 135, 229, .35); border-radius: 10px;
  }
  .attach code { font-family: var(--mono); font-size: 12.5px; color: #8fbaf2; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
  .attach button { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: inherit; font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
  .ended { margin-top: 6px; font-size: 12px; color: var(--faint); }

  details { border-top: 1px solid var(--line-soft); }
  summary { cursor: pointer; list-style: none; padding: 10px 14px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  summary::-webkit-details-marker { display: none; }
  details[open] summary { color: var(--text); }
  .paths { padding: 0 14px 12px; display: grid; gap: 6px; }
  .paths div { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  .paths div b { font-family: system-ui, sans-serif; font-weight: 600; color: var(--faint); margin-right: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

  .actions { padding: 12px 14px 14px; border-top: 1px solid var(--line-soft); }
  .primary {
    width: 100%; min-height: 46px; border: 0; border-radius: 13px; font: inherit; font-weight: 650; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), #6d5df0); box-shadow: 0 6px 20px rgba(109, 93, 240, .3);
  }
  .primary:disabled { background: var(--raised); color: var(--faint); box-shadow: none; }
  .primary:active:not(:disabled) { transform: scale(.985); }
  .hint { font-size: 12px; color: var(--faint); text-align: center; margin-top: 8px; }

  .panel { background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .panel h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .hero { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 2px; }
  .hero b { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
  .hero span { color: var(--muted); font-size: 13px; }
  .readout { font-size: 12.5px; color: var(--muted); min-height: 18px; margin-bottom: 6px; }
  .readout strong { color: var(--text); font-weight: 600; }
  .chart { width: 100%; display: block; touch-action: pan-y; }
  .chart text { fill: var(--faint); font-size: 10px; font-family: system-ui, sans-serif; }
  .chart .hl { fill: rgba(255, 255, 255, .06); }
  .section { margin-top: 18px; }
  .section h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .rank { display: grid; grid-template-columns: minmax(0, 38%) 1fr auto; gap: 6px 10px; align-items: center; margin-top: 8px; }
  .rank .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .track { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .rank .fill { height: 100%; border-radius: 999px; background: var(--series-commits); }
  .rank .v { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--faint); font-size: 13px; }
  .table-wrap { max-height: 260px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line-soft); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
  .panel details { border-top: 0; margin-top: 10px; }
  .panel summary { padding: 6px 0; }
  .spark { display: flex; align-items: center; gap: 10px; padding: 0 14px 12px; color: var(--muted); font-size: 12px; }
  .spark svg { flex: 1; height: 28px; min-width: 0; }
  .app-banner {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); text-decoration: none; color: var(--text);
    background: linear-gradient(135deg, rgba(139, 124, 246, .22), rgba(94, 196, 255, .12)); border: 1px solid rgba(139, 124, 246, .4);
  }
  .app-banner .logo { width: 38px; height: 38px; }
  .app-banner div { flex: 1; min-width: 0; }
  .app-banner b { display: block; font-size: 15px; }
  .app-banner span { font-size: 12px; color: var(--muted); }
  /* tabs */
  header { flex-wrap: wrap; row-gap: 10px; }
  .tabs { flex-basis: 100%; display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .tabs button { flex: 1; min-height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 2px 8px rgba(0,0,0,.3); }
  .tab { display: grid; gap: 14px; }
  .tab[hidden] { display: none; }
  .chip.claude { color: #f0a07e; border-color: rgba(217, 89, 38, .45); background: rgba(217, 89, 38, .12); }
  .chip.codex { color: #8fbaf2; border-color: rgba(57, 135, 229, .45); background: rgba(57, 135, 229, .12); }
  .chip.gemini { color: #6fd3ad; border-color: rgba(25, 158, 112, .45); background: rgba(25, 158, 112, .12); }
  .publish { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .publish a.chip { text-decoration: none; }
  .publish .note { font-size: 12px; color: var(--faint); flex-basis: 100%; }
  .chip.running { color: var(--accent); border-color: rgba(139, 124, 246, .45); }
  .chip.running svg { animation: spin 1.2s linear infinite; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .section-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .small-btn { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .small-btn.danger { color: var(--bad); }
  .small-btn.go { background: var(--accent); border-color: transparent; color: #fff; }
  .item { padding: 12px 14px; border-top: 1px solid var(--line-soft); display: grid; gap: 6px; }
  .item:first-of-type { border-top: 0; }
  .item .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .item .err { font-size: 12.5px; color: var(--bad); overflow-wrap: anywhere; }
  .item .actions-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .list-card { background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .list-card .empty { padding: 22px 14px; }
  /* meters: the fill carries severity, the track is a lighter step of the same hue */
  .meter-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .meter { height: 10px; border-radius: 999px; overflow: hidden; }
  .meter > div { height: 100%; border-radius: 999px; }
  .meter-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter-row .r { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -4px; }
  .agent-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 650; }
  .agent-title i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  /* job form */
  dialog.sheet { width: min(560px, calc(100% - 20px)); max-height: calc(100vh - 40px); overflow: auto; }
  .field { display: grid; gap: 6px; margin-top: 14px; }
  .field > label, .field > span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .seg button { flex: 1; min-height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); font-weight: 600; }
  dialog select, dialog textarea, dialog input[type="datetime-local"], dialog input[type="time"] {
    width: 100%; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 10px 12px; font: inherit; font-size: 14px;
  }
  dialog textarea { min-height: 120px; resize: vertical; }
  .days { display: flex; gap: 4px; }
  .days button { flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: inherit; font-size: 12.5px; }
  .days button[aria-pressed="true"] { background: rgba(139, 124, 246, .18); border-color: rgba(139, 124, 246, .5); color: var(--text); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--text); margin-top: 14px; }
  .check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent); }
  .hint-text { font-size: 12.5px; color: var(--faint); }
  .log { font-family: var(--mono); font-size: 12px; display: grid; gap: 6px; margin-top: 10px; }
  .log div { overflow-wrap: anywhere; white-space: pre-wrap; padding-left: 10px; border-left: 2px solid var(--line); }
  .log .tool { color: var(--muted); }
  .log .error { color: var(--bad); border-left-color: var(--bad); }
  .log .done { color: var(--ok); border-left-color: var(--ok); }
  .empty, .error { text-align: center; color: var(--muted); padding: 40px 16px; }
  .error strong { color: var(--bad); display: block; margin-bottom: 6px; font-size: 16px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    max-width: calc(100% - 28px); width: max-content; padding: 11px 16px; border-radius: 12px; font-size: 14px;
    background: #1d2333; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { border-color: rgba(248, 113, 113, .5); }

  dialog { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: min(420px, calc(100% - 28px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h2 { margin: 0 0 6px; font-size: 17px; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  dialog code { font-family: var(--mono); font-size: 12px; color: var(--accent-2); overflow-wrap: anywhere; }
  dialog input { width: 100%; height: 44px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font: inherit; font-family: var(--mono); font-size: 13px; }
  dialog .row { display: flex; gap: 8px; margin-top: 12px; }
  dialog .row button { flex: 1; min-height: 42px; border-radius: 11px; font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  dialog .row .primary { border: 0; }
  /* Four across truncates the labels on phones. */
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <div class="title">
    <h1>LLM Manager</h1>
    <div class="status" id="status" aria-live="polite">Loading…</div>
  </div>
  <button class="icon-btn" id="lock" type="button" aria-label="Access token"></button>
  <button class="icon-btn" id="refresh" type="button" aria-label="Refresh"></button>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" type="button" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" type="button" data-tab="schedule" aria-selected="false">Schedule</button>
    <button role="tab" type="button" data-tab="usage" aria-selected="false">Usage</button>
  </nav>
</header>
<main>
  <section class="tab" id="tab-overview">
    <div id="app-slot"></div>
    <section class="stats" id="stats" aria-label="Summary"></section>
    <section class="panel" id="analytics" aria-label="Activity" hidden></section>
    <div id="projects"></div>
  </section>
  <section class="tab" id="tab-schedule" hidden></section>
  <section class="tab" id="tab-usage" hidden></section>
</main>
<dialog id="job-dialog" class="sheet"></dialog>
<dialog id="log-dialog" class="sheet"></dialog>
<div class="toast" id="toast" role="status"></div>
<dialog id="token-dialog">
  <div>
    <h2>Access token</h2>
    <p>Starting Codex and scheduling runs need the server's token. On the server run<br><code>cat ~/.config/llm-manager/api-token</code><br>and paste it here. It is stored only in this browser.</p>
    <input id="token-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste token">
    <div class="row">
      <button id="token-cancel" type="button">Cancel</button>
      <button id="token-save" type="button" class="primary">Save</button>
    </div>
  </div>
</dialog>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $("projects"), stats = $("stats"), status = $("status"), toastEl = $("toast");
  const TOKEN_KEY = "llm-manager.token";
  const REFRESH_MS = 30000;
  let inFlight = false, codexAvailable = false, toastTimer = 0, projectsCache = [], activeTab = "overview";

  const ICONS = {
    refresh: "M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5",
    link: "M14 3h7v7M10 14 21 3M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5",
    branch: "M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9",
    terminal: "M4 17l6-6-6-6M12 19h8",
    lock: "M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z",
    unlock: "M7 11V7a5 5 0 0 1 9.9-1M5 11h14v10H5z",
    copy: "M9 9h11v11H9zM5 15H4V4h11v1",
    play: "M7 4l13 8-13 8z",
    plus: "M12 5v14M5 12h14",
    pause: "M8 5v14M16 5v14",
    trash: "M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",
    list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
    x: "M6 6l12 12M18 6 6 18",
    loader: "M12 3a9 9 0 1 0 9 9",

      inFlight = false;
      $("refresh").classList.remove("spin");
    }
  }


  // ---------- shared ----------
  const compact = (n) => (Math.abs(n) >= 10000 ? new Intl.NumberFormat([], { notation: "compact", maximumFractionDigits: 1 }).format(n) : String(n));
  const chartWidth = () => Math.max(240, document.querySelector("main").clientWidth - 58);
  const fmtTime = (iso) => new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const AGENT = {
    claude: { label: "Claude", chip: "claude", color: "var(--series-agent)" },
    codex: { label: "Codex", chip: "codex", color: "var(--series-codex)" },
    gemini: { label: "Gemini", chip: "gemini", color: "var(--series-gemini)" },
  };
  const defaultReviewer = (agent) => (agent === "claude" ? "codex" : "claude");
  const STAGE = { work: "Build", review: "Review", fix: "Fix", resume: "Resume" };
  const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  function until(iso) {
    const seconds = Math.round((Date.parse(iso) - Date.now()) / 1000);
    if (!Number.isFinite(seconds)) return "";
    if (seconds <= 60) return "now";
    const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), d = Math.floor(h / 24);
    return "in " + (d >= 1 ? d + "d " + (h % 24) + "h" : h >= 1 ? h + "h " + m + "m" : m + "m");
  }

  /** Authenticated JSON request; prompts for the token once on 401. */
  async function api(path, options) {
    const send = () => fetch(path, Object.assign({ cache: "no-store" }, options || {}, {
      headers: Object.assign({ Accept: "application/json", Authorization: "Bearer " + getToken() }, (options && options.headers) || {}),
    }));
    let response = await send();
    if (response.status === 401 && await askToken()) response = await send();
    const type = response.headers.get("Content-Type") || "";
    const body = type.includes("application/json") ? await response.json().catch(() => ({})) : {};
    return { ok: response.ok, status: response.status, body };
  }

  function showTab(name) {
    activeTab = name;
    for (const button of document.querySelectorAll(".tabs button")) button.setAttribute("aria-selected", String(button.dataset.tab === name));
    for (const tab of ["overview", "schedule", "usage"]) $("tab-" + tab).hidden = tab !== name;
    try { localStorage.setItem("llm-manager.tab", name); } catch (_) { /* private mode */ }
    refreshActive();
  }

  function refreshActive() {
    if (activeTab === "schedule") return loadSchedule();
    if (activeTab === "usage") return loadUsage();
    return load();
  }

  // ---------- schedule ----------
  let scheduleData = null;
  const scheduleTab = $("tab-schedule");

  function describeSchedule(job) {
    const sc = job.schedule;
    if (sc.at) return job.done ? "Ran " + fmtTime(job.lastFiredAt || sc.at) : "Once · " + fmtTime(sc.at);
    const days = sc.days && sc.days.length && sc.days.length < 7
      ? (sc.days.join() === "1,2,3,4,5" ? "Mon–Fri" : sc.days.map((d) => DAY_NAMES[d - 1]).join(" "))
      : "every day";
    const here = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return "Daily " + sc.time + " · " + days + (sc.zone && sc.zone !== here ? " (" + sc.zone + ")" : "");
  }

  function statusChip(run) {
    switch (run.status) {
      case "queued": return chip(run.notBefore && Date.parse(run.notBefore) > Date.now() ? "waits " + until(run.notBefore) : "queued", null, "clock");
      case "running": return chip("running", "running", "loader");
      case "succeeded": return chip("done", "ok", "check");
      case "limited": return chip(run.resumeScheduled ? "limit · resumes" : "usage limit", "warn", "alert");
      case "cancelled": return chip("cancelled", null, "x");
      default: return chip("failed", "bad", "alert");
    }
  }

  function jobItem(view) {
    const job = view.job;
    const agents = job.kind === "pipeline" ? [job.agent, job.reviewer || defaultReviewer(job.agent)] : [job.agent];
    const action = (path, label, iconName, cls, confirmText) => el("button", { class: "small-btn " + (cls || ""), type: "button", onclick: async () => {
      if (confirmText && !confirm(confirmText)) return;
      const result = await api("/api/jobs/" + encodeURIComponent(job.id) + "/" + path, { method: "POST" });
      toast(result.ok ? label + " ✓" : (result.body.error || "Failed (" + result.status + ")"), !result.ok);
      loadSchedule();
    } }, icon(iconName), label);
    return el("div", { class: "item" },
      el("div", { class: "row" }, el("span", { class: "name", title: job.name }, job.name),
        job.enabled ? null : chip("paused", null, "pause")),
      el("div", { class: "row" },
        agents.map((a, i) => chip((job.kind === "pipeline" ? (i === 0 ? "builds: " : "reviews: ") : "") + AGENT[a].label, AGENT[a].chip)),
        chip(job.projectName, null, "folder")),
      el("div", { class: "meta" }, describeSchedule(job) + (view.nextRunAt && job.enabled ? " · next " + until(view.nextRunAt) : "")),
      el("div", { class: "meta" }, job.prompt.length > 160 ? job.prompt.slice(0, 160) + "…" : job.prompt),
      el("div", { class: "actions-row" },
        action("run", "Run now", "play", "go"),
        job.enabled ? action("pause", "Pause", "pause") : action("enable", "Enable", "play"),
        action("delete", "Delete", "trash", "danger", "Delete \"" + job.name + "\"? Past runs and their branches stay.")));
  }

  function runItem(run) {
    const live = run.status === "running" && run.tmuxSession;
    return el("div", { class: "item" },
      el("div", { class: "row" },
        chip(AGENT[run.agent].label, AGENT[run.agent].chip),
        el("span", { class: "name" }, STAGE[run.stage] + " · " + run.projectName),
        statusChip(run)),
      el("div", { class: "meta" },
        (run.branch ? run.branch + " · " : "") + (run.startedAt ? "started " + relative(run.startedAt) : "created " + relative(run.createdAt)) +
        (run.pipelineId ? " · pipeline " + run.pipelineId.slice(0, 6) : "")),
      run.summary ? el("div", { class: "meta" }, run.summary.length > 220 ? run.summary.slice(0, 220) + "…" : run.summary) : null,
      run.error ? el("div", { class: "err" }, run.error.length > 220 ? run.error.slice(0, 220) + "…" : run.error) : null,
      live ? attachBox({ running: true, attachCommand: "tmux attach -t " + run.tmuxSession }) : null,
      el("div", { class: "actions-row" },
        el("button", { class: "small-btn", type: "button", onclick: () => openLog(run) }, icon("list"), "Log"),
        run.status === "queued" || run.status === "running"
          ? el("button", { class: "small-btn danger", type: "button", onclick: async () => {
              if (!confirm("Cancel this run? Its worktree and branch are kept.")) return;
              const result = await api("/api/runs/" + encodeURIComponent(run.id) + "/cancel", { method: "POST" });
              toast(result.ok ? "Cancelled" : (result.body.error || "Failed"), !result.ok);
              loadSchedule();
            } }, icon("x"), "Cancel")
          : null));
  }

  async function loadSchedule() {
    if (!getToken()) {
      scheduleTab.replaceChildren(el("div", { class: "panel" },
        el("div", { class: "section-head" }, el("h2", null, "Schedule")),
        el("p", { class: "muted" }, "Schedules and run logs need the server's access token."),
        el("button", { class: "small-btn go", type: "button", onclick: async () => { if (await askToken()) loadSchedule(); } }, icon("lock"), "Enter token")));
      return;
    }
    $("refresh").classList.add("spin");
    try {
      const result = await api("/api/schedule");
      if (!result.ok) throw new Error(result.body.error || "Failed (" + result.status + ")");
      scheduleData = result.body;
      const jobs = scheduleData.jobs, runs = scheduleData.runs;
      scheduleTab.replaceChildren(
        el("div", { class: "section-head" }, el("h2", null, "Jobs"),
          el("button", { class: "small-btn go", type: "button", onclick: () => openJobForm() }, icon("plus"), "New job")),
        el("div", { class: "list-card" }, jobs.length ? jobs.map(jobItem)
          : el("div", { class: "empty" }, "No jobs yet. Schedule a run, a build-and-review, or a resume.")),
        el("div", { class: "section-head" }, el("h2", null, "Recent runs")),
        el("div", { class: "list-card" }, runs.length ? runs.map(runItem) : el("div", { class: "empty" }, "No runs yet.")));
      status.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (error) {
      scheduleTab.replaceChildren(el("div", { class: "error" }, el("strong", null, "Couldn't load the schedule"), error.message));
    } finally {
      $("refresh").classList.remove("spin");
    }
  }

  async function openLog(run) {
    const dialog = $("log-dialog");
    const body = el("div", { class: "log" }, el("div", null, "Loading…"));
    dialog.replaceChildren(
      el("div", { class: "section-head" }, el("h2", null, STAGE[run.stage] + " · " + AGENT[run.agent].label),
        el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
      el("div", { class: "meta muted" }, run.projectName + (run.branch ? " · " + run.branch : "")),
      el("details", null, el("summary", null, "Prompt"), el("div", { class: "log" }, el("div", null, run.prompt))),
      body);
    dialog.showModal();
    const result = await api("/api/runs/" + encodeURIComponent(run.id) + "/log");
    if (!result.ok) { body.replaceChildren(el("div", { class: "error" }, result.body.error || "Failed")); return; }
    const lines = result.body.activity || [];
    body.replaceChildren(...(lines.length ? lines.map((l) => el("div", { class: l.kind }, l.text)) : [el("div", null, "No activity recorded yet.")]));
  }

  function segmented(options, value, onChange) {
    const group = el("div", { class: "seg", role: "group" });
    const render = (current) => group.replaceChildren(...options.map(([v, label]) =>
      el("button", { type: "button", "aria-pressed": String(v === current), onclick: () => { render(v); onChange(v); } }, label)));
    render(value);
    return group;
  }

  async function openJobForm() {
    if (!projectsCache.length) await load();
    const form = { kind: "run", agent: "claude", reviewer: "codex", when: "now", days: [1, 2, 3, 4, 5] };
    const agentOptions = [["claude", "Claude"], ["codex", "Codex"], ["gemini", "Gemini"]];
    const dialog = $("job-dialog");
    const agentsOk = (scheduleData && scheduleData.agents) || {};
    const project = el("select", null, projectsCache.map((p) => el("option", { value: p.id }, p.name)));
    const resumable = (scheduleData && scheduleData.resumable) || [];
    const session = el("select", null, resumable.length
      ? resumable.map((r, i) => el("option", { value: String(i) }, r.projectName + " · " + (r.branch || "detached") + " · " + AGENT[r.session.agent].label + " · " + relative(r.session.updatedAt)))
      : el("option", { value: "" }, "No resumable sessions in agent worktrees"));
    const prompt = el("textarea", { placeholder: "What should the agent do?" });
    const soon = new Date(Date.now() + 3600e3); soon.setMinutes(0, 0, 0);
    const pad = (n) => String(n).padStart(2, "0");
    const at = el("input", { type: "datetime-local", value: `${soon.getFullYear()}-${pad(soon.getMonth() + 1)}-${pad(soon.getDate())}T${pad(soon.getHours())}:00` });
    const time = el("input", { type: "time", value: "09:00" });
    const resumeOnLimit = el("input", { type: "checkbox", checked: true });
    const daysGroup = el("div", { class: "days" });
    const renderDays = () => daysGroup.replaceChildren(...DAY_NAMES.map((name, i) => el("button", {
      type: "button", "aria-pressed": String(form.days.includes(i + 1)),
      onclick: () => { form.days = form.days.includes(i + 1) ? form.days.filter((d) => d !== i + 1) : [...form.days, i + 1].sort(); renderDays(); },
    }, name)));
    renderDays();
    const agentHint = el("div", { class: "hint-text" });
    const reviewerSlot = el("div");
    const renderReviewer = () => {
      if (form.reviewer === form.agent) form.reviewer = defaultReviewer(form.agent);
      reviewerSlot.replaceChildren(segmented(agentOptions.filter(([v]) => v !== form.agent), form.reviewer, (v) => { form.reviewer = v; sync(); }));
    };
    const fields = {
      project: el("div", { class: "field" }, el("label", null, "Project"), project),
      agent: el("div", { class: "field" }, el("span", null, "Agent"), segmented(agentOptions, form.agent, (v) => { form.agent = v; renderReviewer(); sync(); }), agentHint),
      reviewer: el("div", { class: "field" }, el("span", null, "Reviewer"), reviewerSlot),
      session: el("div", { class: "field" }, el("label", null, "Session to continue"), session,
        el("div", { class: "hint-text" }, "Only sessions in agent worktrees can be resumed, never your own checkout.")),
      prompt: el("div", { class: "field" }, el("label", null, "Task"), prompt),
      at: el("div", { class: "field" }, el("label", null, "Date and time"), at),
      daily: el("div", { class: "field" }, el("label", null, "Time"), time, daysGroup),
    };
    function sync() {
      const resume = form.kind === "resume";
      fields.project.hidden = resume; fields.agent.hidden = resume; fields.session.hidden = !resume;
      prompt.placeholder = resume ? "Optional: what to tell it (default: continue where you left off)" : "What should the agent do?";
      fields.at.hidden = form.when !== "once"; fields.daily.hidden = form.when !== "daily";
      fields.reviewer.hidden = form.kind !== "pipeline";
      const missing = [form.agent, form.kind === "pipeline" ? form.reviewer : null].filter((a) => a && agentsOk[a] === false);
      agentHint.textContent = (form.kind === "pipeline"
        ? AGENT[form.agent].label + " builds and commits, " + AGENT[form.reviewer].label + " reviews the commit, then " + AGENT[form.agent].label + " addresses the review. "
        : "") + missing.map((a) => AGENT[a].label + " is not installed on the server.").join(" ");
    }
    const submit = el("button", { class: "primary", type: "button" }, "Create job");
    submit.addEventListener("click", async () => {
      const request = { kind: form.kind, agent: form.agent, prompt: prompt.value, resumeOnLimitReset: resumeOnLimit.checked };
      if (form.kind === "pipeline") request.reviewer = form.reviewer;
      if (form.kind === "resume") {
        const target = resumable[Number(session.value)];
        if (!target) { toast("Choose a session to resume", true); return; }
        request.projectId = target.projectId;
        request.resume = { agent: target.session.agent, sessionId: target.session.sessionId, worktree: target.session.worktree };
        request.agent = target.session.agent;
      } else {
        request.projectId = project.value;
      }
      if (form.when === "once") request.schedule = { at: new Date(at.value).toISOString() };
      if (form.when === "daily") request.schedule = { time: time.value, days: form.days, zone: Intl.DateTimeFormat().resolvedOptions().timeZone };
      submit.disabled = true;
      const result = await api("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(request) });
      submit.disabled = false;
      if (!result.ok) { toast(result.body.error || "Failed (" + result.status + ")", true); return; }
      dialog.close();
      toast(form.when === "now" ? "Started" : "Scheduled");
      loadSchedule();
    });
    dialog.replaceChildren(
      el("div", { class: "section-head" }, el("h2", null, "New job"),
        el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
      el("div", { class: "field" }, el("span", null, "What"),
        segmented([["run", "Run a task"], ["pipeline", "Build + review"], ["resume", "Resume"]], form.kind, (v) => { form.kind = v; sync(); })),
      fields.project, fields.agent, fields.reviewer, fields.session, fields.prompt,
      el("div", { class: "field" }, el("span", null, "When"), segmented([["now", "Now"], ["once", "Once"], ["daily", "Repeat"]], form.when, (v) => { form.when = v; sync(); })),
      fields.at, fields.daily,
      el("label", { class: "check" }, resumeOnLimit, el("span", null, "If a usage limit stops it, continue automatically when the limit resets")),
      el("p", { class: "hint-text" }, "Runs work in a new branch and worktree, may edit files and run build/test commands, and never push."),
      el("div", { class: "row" }, submit));
    renderReviewer();
    sync();
    dialog.showModal();
  }

  // ---------- usage ----------
  const usageTab = $("tab-usage");
  let lastUsage = null;

  function meter(win) {
    const pct = Math.max(0, Math.min(100, win.usedPercent));
    const color = pct >= 90 ? "var(--bad)" : pct >= 70 ? "var(--warn)" : "var(--accent)";
    const track = pct >= 90 ? "rgba(248,113,113,.18)" : pct >= 70 ? "rgba(251,191,36,.18)" : "rgba(139,124,246,.18)";
    return el("div", { class: "meter-row" },
      el("span", null, win.label),
      el("div", { class: "meter", style: "background:" + track, role: "meter", "aria-valuenow": String(Math.round(pct)), "aria-valuemin": "0", "aria-valuemax": "100", "aria-label": win.label + " limit used" },
        el("div", { style: "width:" + pct + "%;background:" + color })),
      el("span", { class: "v" }, Math.round(win.usedPercent) + "%"),
      win.resetsAt ? el("span", { class: "r" }, "resets " + until(win.resetsAt) + " · " + fmtTime(win.resetsAt)) : null);
  }

  function agentPanel(key, usage, days) {
    const a = AGENT[key];
    const total = usage.tokensPerDay.reduce((x, y) => x + y, 0);
    const cache = usage.cacheReadsPerDay.reduce((x, y) => x + y, 0);
    const readout = el("div", { class: "readout" }, "Tap a day for details");
    const top = usage.models.length ? usage.models[0].tokens : 0;
    return el("section", { class: "panel" },
      el("div", { class: "agent-title" }, el("i", { style: "background:" + a.color }), a.label),
      el("div", { class: "section" }, el("h3", null, "Plan limits"),
        usage.windows.length ? usage.windows.map(meter) : null,
        usage.windowsAsOf ? el("div", { class: "hint-text", style: "margin-top:8px" }, "As of " + relative(usage.windowsAsOf)) : null,
        usage.note ? el("div", { class: "hint-text", style: "margin-top:8px" }, usage.note) : null),
      el("div", { class: "section" }, el("h3", null, "Tokens · last " + days.length + " days"),
        el("div", { class: "hero" }, el("b", null, compact(total)), el("span", null, "tokens" + (cache ? " · " + compact(cache) + " more read from cache" : ""))),
        readout,
        total ? columnChart(days, [{ values: usage.tokensPerDay, color: a.color }], readout, (i) => compact(usage.tokensPerDay[i]) + " tokens")
          : el("div", { class: "muted" }, "No usage recorded in this window.")),
      usage.models.length > 1 ? el("div", { class: "section" }, el("h3", null, "By model"),
        el("div", { class: "rank" }, usage.models.map((m) => [
          el("div", { class: "n", title: m.model }, m.model),
          el("div", { class: "track" }, el("div", { class: "fill", style: "background:" + a.color + ";width:" + Math.max(3, (m.tokens / top) * 100) + "%" })),
          el("div", { class: "v" }, compact(m.tokens))]))) : null);
  }

  function renderUsage(data) {
    lastUsage = data;
    usageTab.replaceChildren(agentPanel("claude", data.claude, data.days), agentPanel("codex", data.codex, data.days),
      data.gemini ? agentPanel("gemini", data.gemini, data.days) : null,
      el("p", { class: "hint-text" }, "From local records on the server: Claude Code and Codex session logs, Claude's status line, and Gemini runs started here. Tokens exclude cache reads."));
  }

  async function loadUsage() {
    $("refresh").classList.add("spin");
    try {
      const response = await fetch("/api/usage", { cache: "no-store", headers: { Accept: "application/json" } });
      const type = response.headers.get("Content-Type") || "";
      if (!response.ok || !type.includes("application/json")) throw new Error("Unexpected response (" + response.status + ")");
      renderUsage(await response.json());
      status.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (error) {
      usageTab.replaceChildren(el("div", { class: "error" }, el("strong", null, "Couldn't load usage"), error.message));
    } finally {
      $("refresh").classList.remove("spin");
    }
  }

  $("token-cancel").addEventListener("click", () => $("token-dialog").close("cancel"));
  $("token-save").addEventListener("click", () => $("token-dialog").close("save"));
  $("token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("token-dialog").close("save"); });
  $("logo").append(icon("spark"));
  $("refresh").append(icon("refresh"));
  $("refresh").addEventListener("click", refreshActive);
  for (const button of document.querySelectorAll(".tabs button")) button.addEventListener("click", () => showTab(button.dataset.tab));
  $("lock").addEventListener("click", async () => {
    if (getToken() && confirm("Forget the saved access token on this device?")) { setToken(""); renderLock(); toast("Token removed"); return; }
    if (!getToken() && await askToken()) toast("Token saved");
  });
  renderLock();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshActive(); });
  setInterval(() => { if (!document.hidden && !document.querySelector("dialog[open]")) refreshActive(); }, REFRESH_MS);
  let saved = "overview";
  try { saved = localStorage.getItem("llm-manager.tab") || "overview"; } catch (_) { /* private mode */ }
  load();
  if (saved !== "overview" && ["schedule", "usage"].includes(saved)) showTab(saved);
})();
</script>
</body>
</html>
