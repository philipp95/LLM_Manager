  async function loadSchedule() {
    if (!(await ensureAccess())) { scheduleTab.replaceChildren(lockedPanel(false)); return; }
    spin(true);
    try {
      const result = await api("/api/schedule");
      if (!result.ok) throw new Error(result.body.error || "Failed (" + result.status + ")");
      scheduleData = result.body;
      const jobs = scheduleData.jobs, runs = scheduleData.runs;
      const sandbox = scheduleData.sandbox;
      const sandboxed = sandbox && Object.values(sandbox.agents || {}).some(Boolean);
      scheduleTab.replaceChildren(...[
        sandbox ? el("div", { class: "panel sandbox-row" },
          chip(sandboxed ? "Agent sandbox on" : "Agent sandbox off", sandboxed ? "ok" : "warn", sandboxed ? "check" : "alert"),
          el("span", { class: "hint-text" }, sandbox.note)) : null,
        el("div", { class: "section-head" }, el("h2", null, "Jobs"),
          el("button", { class: "small-btn go", type: "button", onclick: () => openJobForm() }, icon("plus"), "New job")),
        el("div", { class: "list-card" }, jobs.length ? jobs.map(jobItem)
          : el("div", { class: "empty" }, "No jobs yet. Schedule a run, a build-and-review, or a resume.")),
        el("div", { class: "section-head" }, el("h2", null, "Recent runs")),
        el("div", { class: "list-card" }, runs.length ? runs.map(runItem) : el("div", { class: "empty" }, "No runs yet.")),
      ].filter(Boolean));
      stamp();
    } catch (error) {
      scheduleTab.replaceChildren(el("div", { class: "error" }, el("strong", null, "Couldn't load the schedule"), error.message));
    } finally {
      spin(false);
    }
  }

  async function openLog(run) {
    const dialog = $("log-dialog");
    const body = el("div", { class: "log" }, el("div", null, "Loading…"));
    dialog.replaceChildren(
      el("div", { class: "section-head" }, el("h2", null, STAGE[run.stage] + " · " + AGENT[run.agent].label),
        el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
      el("div", { class: "meta" }, run.projectName + (run.branch ? " · " + run.branch : "")),
      el("details", null, el("summary", null, "Prompt"), el("div", { class: "log" }, el("div", null, run.prompt))),
      body);
    dialog.showModal();
    const result = await api("/api/runs/" + encodeURIComponent(run.id) + "/log");
    if (!result.ok) { body.replaceChildren(el("div", { class: "error" }, result.body.error || "Failed")); return; }
    const lines = result.body.activity || [];
    body.replaceChildren(...(lines.length ? lines.map((l) => el("div", { class: l.kind }, l.text)) : [el("div", null, "No activity recorded yet.")]));
  }

  function segmented(options, value, onChange) {
    const group = el("div", { class: "seg", role: "group" });
    const render = (current) => group.replaceChildren(...options.map(([v, label]) =>
      el("button", { type: "button", "aria-pressed": String(v === current), onclick: () => { render(v); onChange(v); } }, label)));
    render(value);
    return group;
  }

  async function openJobForm() {
    if (!projectsCache.length) await load();
    const form = { kind: "run", agent: "claude", reviewer: "codex", when: "now", days: [1, 2, 3, 4, 5] };
    const agentOptions = [["claude", "Claude"], ["codex", "Codex"], ["gemini", "Gemini"]];
    const dialog = $("job-dialog");
    const agentsOk = (scheduleData && scheduleData.agents) || {};
    const project = el("select", null, projectsCache.map((p) => el("option", { value: p.id }, p.name)));
    const resumable = (scheduleData && scheduleData.resumable) || [];
    const session = el("select", null, resumable.length
      ? resumable.map((r, i) => el("option", { value: String(i) }, r.projectName + " · " + (r.branch || "detached") + " · " + AGENT[r.session.agent].label + " · " + relative(r.session.updatedAt)))
      : el("option", { value: "" }, "No resumable sessions in agent worktrees"));
    const prompt = el("textarea", { placeholder: "What should the agent do?" });
    const soon = new Date(Date.now() + 3600e3); soon.setMinutes(0, 0, 0);
    const pad = (n) => String(n).padStart(2, "0");
    const at = el("input", { type: "datetime-local", value: `${soon.getFullYear()}-${pad(soon.getMonth() + 1)}-${pad(soon.getDate())}T${pad(soon.getHours())}:00` });
    const time = el("input", { type: "time", value: "09:00" });
    const resumeOnLimit = el("input", { type: "checkbox", checked: true });
    const publish = el("input", { type: "checkbox" });
    const publishRowEl = el("label", { class: "check" }, publish, el("span", null, "When it's done, push the branch and open a pull request"));
    const daysGroup = el("div", { class: "days" });
    const renderDays = () => daysGroup.replaceChildren(...DAY_NAMES.map((name, i) => el("button", {
      type: "button", "aria-pressed": String(form.days.includes(i + 1)),
      onclick: () => { form.days = form.days.includes(i + 1) ? form.days.filter((d) => d !== i + 1) : [...form.days, i + 1].sort(); renderDays(); },
    }, name)));
    renderDays();
    const agentHint = el("div", { class: "hint-text" });
    const reviewerSlot = el("div");
    const renderReviewer = () => {
      if (form.reviewer === form.agent) form.reviewer = defaultReviewer(form.agent);
      reviewerSlot.replaceChildren(segmented(agentOptions.filter(([v]) => v !== form.agent), form.reviewer, (v) => { form.reviewer = v; sync(); }));
    };
    const fields = {
      project: el("div", { class: "field" }, el("label", null, "Project"), project),
      agent: el("div", { class: "field" }, el("span", null, "Agent"), segmented(agentOptions, form.agent, (v) => { form.agent = v; renderReviewer(); sync(); }), agentHint),
      reviewer: el("div", { class: "field" }, el("span", null, "Reviewer"), reviewerSlot),
      session: el("div", { class: "field" }, el("label", null, "Session to continue"), session,
        el("div", { class: "hint-text" }, "Only sessions in agent worktrees can be resumed, never your own checkout.")),
      prompt: el("div", { class: "field" }, el("label", null, "Task"), prompt),
      at: el("div", { class: "field" }, el("label", null, "Date and time"), at),
      daily: el("div", { class: "field" }, el("label", null, "Time"), time, daysGroup),
    };
    function sync() {
      const resume = form.kind === "resume";
      fields.project.hidden = resume; fields.agent.hidden = resume; fields.session.hidden = !resume; publishRowEl.hidden = resume;
      prompt.placeholder = resume ? "Optional: what to tell it (default: continue where you left off)" : "What should the agent do?";
      fields.at.hidden = form.when !== "once"; fields.daily.hidden = form.when !== "daily";
      fields.reviewer.hidden = form.kind !== "pipeline";
      const missing = [form.agent, form.kind === "pipeline" ? form.reviewer : null].filter((a) => a && agentsOk[a] === false);
      agentHint.textContent = (form.kind === "pipeline"
        ? AGENT[form.agent].label + " builds and commits, " + AGENT[form.reviewer].label + " reviews the commit, then " + AGENT[form.agent].label + " addresses the review. "
        : "") + missing.map((a) => AGENT[a].label + " is not installed on the server.").join(" ");
    }
    const submit = el("button", { class: "primary", type: "button" }, "Create job");
    submit.addEventListener("click", async () => {
      const request = { kind: form.kind, agent: form.agent, prompt: prompt.value, resumeOnLimitReset: resumeOnLimit.checked, publish: publish.checked && form.kind !== "resume" };
      if (form.kind === "pipeline") request.reviewer = form.reviewer;
      if (form.kind === "resume") {
        const target = resumable[Number(session.value)];
        if (!target) { toast("Choose a session to resume", true); return; }
        request.projectId = target.projectId;
        request.resume = { agent: target.session.agent, sessionId: target.session.sessionId, worktree: target.session.worktree };
        request.agent = target.session.agent;
      } else {
        request.projectId = project.value;
      }
      if (form.when === "once") request.schedule = { at: new Date(at.value).toISOString() };
      if (form.when === "daily") request.schedule = { time: time.value, days: form.days, zone: Intl.DateTimeFormat().resolvedOptions().timeZone };
      submit.disabled = true;
      const result = await postJson("/api/jobs", request);
      submit.disabled = false;
      if (!result.ok) { toast(result.body.error || "Failed (" + result.status + ")", true); return; }
      dialog.close();
      toast(form.when === "now" ? "Started" : "Scheduled");
      loadSchedule();
    });
    dialog.replaceChildren(
      el("div", { class: "section-head" }, el("h2", null, "New job"),
        el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
      el("div", { class: "field" }, el("span", null, "What"),
        segmented([["run", "Run a task"], ["pipeline", "Build + review"], ["resume", "Resume"]], form.kind, (v) => { form.kind = v; sync(); })),
      fields.project, fields.agent, fields.reviewer, fields.session, fields.prompt,
      el("div", { class: "field" }, el("span", null, "When"), segmented([["now", "Now"], ["once", "Once"], ["daily", "Repeat"]], form.when, (v) => { form.when = v; sync(); })),
      fields.at, fields.daily,
      el("label", { class: "check" }, resumeOnLimit, el("span", null, "If a usage limit stops it, continue automatically when the limit resets")),
      publishRowEl,
      el("p", { class: "hint-text" }, "Runs work in a new branch and worktree, may edit files and run build/test commands. Only the server pushes, and only when asked."),
      el("div", { class: "row" }, submit));
    renderReviewer();
    sync();
    dialog.showModal();
  }

  // ---------- charts: inline SVG on paper, sized to the panel in CSS pixels ----------
  const chartWidth = () => Math.max(240, usageTab.clientWidth - 28);

  // A data-end rounded 4px at the top, square at the baseline.
  function column(x, y, w, h, color, roundTop) {
    const r = roundTop ? Math.min(4, w / 2, h) : 0;
    const d = `M${x},${y + h}V${y + r}` + (r ? `Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}` : `H${x + w}`) + `V${y + h}Z`;
    return svgEl("path", { d, fill: color });
  }

  /** Columns per day; `series` are stacked bottom-up with a 2px surface gap. */
  function columnChart(days, series, readout, describe) {
    const width = chartWidth(), height = 132, top = 8, bottom = 20, left = 30;
    const plotW = width - left, plotH = height - top - bottom;
    const totals = days.map((_, i) => series.reduce((sum, s) => sum + s.values[i], 0));
    const max = niceMax(Math.max(...totals));
    const band = plotW / days.length, barW = Math.max(2, Math.min(24, band - 2));
    const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, width, height, role: "img" });
    const y = (v) => top + plotH - (v / max) * plotH;
    // Counts are whole numbers: only show a midline when it lands on one.
    for (const tick of max >= 4 && max % 2 === 0 ? [0, max / 2, max] : [0, max]) {
      svg.append(svgEl("line", { x1: left, x2: width, y1: y(tick), y2: y(tick), stroke: "var(--paper-line)", "stroke-width": 1 }));
      const label = svgEl("text", { x: left - 6, y: y(tick) + 3, "text-anchor": "end" });
      label.textContent = compact(tick);
      svg.append(label);
    }
    const highlight = svgEl("rect", { class: "hl", y: top, height: plotH, width: band, x: -band, rx: 4 });
    svg.append(highlight);
    days.forEach((day, i) => {
      const x = left + i * band + (band - barW) / 2;
      let base = top + plotH;
      const visible = series.filter((s) => s.values[i] > 0);
      visible.forEach((s, k) => {
        const h = Math.max(1, (s.values[i] / max) * plotH - (k > 0 ? 2 : 0));
        base -= h + (k > 0 ? 2 : 0);
        svg.append(column(x, base, barW, h, s.color, k === visible.length - 1));
      });
    });
    for (const i of [0, Math.floor((days.length - 1) / 2), days.length - 1]) {
      const label = svgEl("text", { x: left + i * band + band / 2, y: height - 5, "text-anchor": i === 0 ? "start" : i === days.length - 1 ? "end" : "middle" });
      label.textContent = fmtDay(days[i]);
      svg.append(label);
    }
    // Hit target: the whole plot, resolved to the nearest day band.
    const hit = svgEl("rect", { x: left, y: 0, width: plotW, height, fill: "transparent" });
    const resting = readout.textContent;
    const show = (event) => {
      const box = svg.getBoundingClientRect();
      const i = Math.min(days.length - 1, Math.max(0, Math.floor(((event.clientX - box.left) * (width / box.width) - left) / band)));
      highlight.setAttribute("x", left + i * band);
      readout.replaceChildren(el("strong", null, fmtDay(days[i], { weekday: "short", month: "short", day: "numeric" })), " · " + describe(i));
    };
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerleave", () => { highlight.setAttribute("x", -band); readout.textContent = resting; });
    svg.append(hit);
    svg.setAttribute("aria-label", readout.textContent);
    return svg;
  }

  function activityPanel(a) {
    if (!a || !Array.isArray(a.days) || !a.days.length) return null;
    const commits = a.commitsPerDay.reduce((x, y) => x + y, 0);
    const codex = a.codexStartsPerDay.reduce((x, y) => x + y, 0);
    const agents = a.agentRunsPerDay.reduce((x, y) => x + y, 0);

    const commitReadout = el("div", { class: "readout" }, "Tap a day for details");
    const commitChart = commits
      ? columnChart(a.days, [{ values: a.commitsPerDay, color: "var(--commits)" }], commitReadout, (i) => plural(a.commitsPerDay[i], "commit", "commits"))
      : el("div", { class: "muted" }, "No commits in the last " + a.days.length + " days.");

    const sessionReadout = el("div", { class: "readout" }, plural(codex, "Codex session", "Codex sessions") + " · " + plural(agents, "agent run", "agent runs"));
    const sessionChart = codex + agents
      ? columnChart(a.days, [
          { values: a.codexStartsPerDay, color: "var(--codex)" },
          { values: a.agentRunsPerDay, color: "var(--claude)" },
        ], sessionReadout, (i) => plural(a.codexStartsPerDay[i], "Codex session", "Codex sessions") + ", " + plural(a.agentRunsPerDay[i], "agent run", "agent runs"))
      : el("div", { class: "muted" }, "No Codex sessions or agent runs yet.");

    const top = a.busiest.length ? a.busiest[0].commits : 0;
    const rank = a.busiest.length
      ? el("div", { class: "rank" }, a.busiest.map((p) => [
          el("div", { class: "n", title: p.name }, p.name),
          el("div", { class: "track" }, el("div", { class: "fill", style: "width:" + Math.max(3, (p.commits / top) * 100) + "%" })),
          el("div", { class: "v" }, p.commits)]))
      : el("div", { class: "muted" }, "No commits in this window.");

    const rows = a.days.map((d, i) => [d, a.commitsPerDay[i], a.codexStartsPerDay[i], a.agentRunsPerDay[i]]).reverse();
    const table = el("details", { class: "table-details" }, el("summary", null, "Show as table"),
      el("div", { class: "table-wrap" }, el("table", null,
        el("thead", null, el("tr", null, el("th", null, "Day"), el("th", null, "Commits"), el("th", null, "Codex"), el("th", null, "Agent runs"))),
        el("tbody", null, rows.map((r) => el("tr", null, el("td", null, fmtDay(r[0], { weekday: "short", month: "short", day: "numeric" })), el("td", null, r[1]), el("td", null, r[2]), el("td", null, r[3])))))));

    return el("section", { class: "panel" },
      el("h2", null, "Activity · last " + a.days.length + " days"),
      el("div", { class: "hero" }, el("b", null, commits.toLocaleString()), el("span", null, commits === 1 ? "commit across all repositories" : "commits across all repositories")),
      commitReadout, commitChart,
      el("div", { class: "section" }, el("h3", null, "Sessions started per day"),
        el("div", { class: "legend" },
          el("span", null, el("i", { style: "background: var(--codex)" }), "Codex"),
          el("span", null, el("i", { style: "background: var(--claude)" }), "Agent runs")),
        sessionReadout, sessionChart),
      el("div", { class: "section" }, el("h3", null, "Busiest repositories"), rank),
      table);
  }

  function meter(win) {
    const pct = Math.max(0, Math.min(100, win.usedPercent));
    const color = pct >= 90 ? "var(--bad)" : pct >= 70 ? "var(--warn)" : "var(--teal)";
    return el("div", { class: "meter-row" },
      el("span", null, win.label),
      el("div", { class: "meter", role: "meter", "aria-valuenow": String(Math.round(pct)), "aria-valuemin": "0", "aria-valuemax": "100", "aria-label": win.label + " limit used" },
        el("div", { style: "width:" + pct + "%;background:" + color })),
      el("span", { class: "v" }, Math.round(win.usedPercent) + "%"),
      win.resetsAt ? el("span", { class: "r" }, "resets " + until(win.resetsAt) + " · " + fmtTime(win.resetsAt)) : null);
  }

  function agentPanel(key, usage, days) {
    const a = AGENT[key];
    const total = usage.tokensPerDay.reduce((x, y) => x + y, 0);
    const cache = usage.cacheReadsPerDay.reduce((x, y) => x + y, 0);
    const readout = el("div", { class: "readout" }, "Tap a day for details");
    const top = usage.models.length ? usage.models[0].tokens : 0;
    return el("section", { class: "panel" },
      el("div", { class: "agent-title" }, agentMark(key), a.label),
      el("div", { class: "section" }, el("h3", null, "Plan limits"),
        usage.windows.length ? usage.windows.map(meter) : null,
        usage.windowsAsOf ? el("div", { class: "hint-text", style: "margin-top:8px" }, "As of " + relative(usage.windowsAsOf)) : null,
        usage.note ? el("div", { class: "hint-text", style: "margin-top:8px" }, usage.note) : null),
      el("div", { class: "section" }, el("h3", null, "Tokens · last " + days.length + " days"),
        el("div", { class: "hero" }, el("b", null, compact(total)), el("span", null, "tokens" + (cache ? " · " + compact(cache) + " more read from cache" : ""))),
        readout,
        total ? columnChart(days, [{ values: usage.tokensPerDay, color: a.color }], readout, (i) => compact(usage.tokensPerDay[i]) + " tokens")
          : el("div", { class: "muted" }, "No usage recorded in this window.")),
      usage.models.length > 1 ? el("div", { class: "section" }, el("h3", null, "By model"),
        el("div", { class: "rank" }, usage.models.map((m) => [
          el("div", { class: "n", title: m.model }, m.model),
          el("div", { class: "track" }, el("div", { class: "fill", style: "background:" + a.color + ";width:" + Math.max(3, (m.tokens / top) * 100) + "%" })),
          el("div", { class: "v" }, compact(m.tokens))]))) : null);
  }

  function renderUsage(data) {
    lastUsage = data;
    usageTab.replaceChildren(
      activityPanel(lastAnalytics),
      agentPanel("claude", data.claude, data.days), agentPanel("codex", data.codex, data.days),
      data.gemini ? agentPanel("gemini", data.gemini, data.days) : null,
      el("p", { class: "hint-text", style: "color:var(--on-harbor-2)" }, "From local records on the server: Claude Code and Codex session logs, Claude's status line, and Gemini runs started here. Tokens exclude cache reads."));
  }

  async function loadUsage() {
    if (!(await ensureAccess())) { usageTab.replaceChildren(lockedPanel(false)); return; }
    spin(true);
    try {
      const [result, projects] = await Promise.all([api("/api/usage", { prompt: false }), fetchProjects().catch(() => null)]);
      if (result.status === 401 || (projects && projects.locked)) { usageTab.replaceChildren(lockedPanel(true)); return; }
      if (!result.ok || !result.json) throw new Error("Unexpected response (" + result.status + ")");
      renderUsage(result.body);
      stamp();
    } catch (error) {
      usageTab.replaceChildren(el("div", { class: "error" }, el("strong", null, "Couldn't load usage"), error.message));
    } finally {
      spin(false);
    }
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (activeTab === "usage" && lastUsage) renderUsage(lastUsage); }, 150);
  });

  // ---------- start ----------
  $("token-cancel").addEventListener("click", () => $("token-dialog").close("cancel"));
  $("token-save").addEventListener("click", () => $("token-dialog").close("save"));
  $("token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("token-dialog").close("save"); });
  $("refresh").append(icon("refresh"));
  $("refresh").addEventListener("click", refreshActive);
  for (const [tab, label, mark] of NAV) {
    const open = () => go(tab === "overview" ? "" : tab);
    $("tabs-top").append(el("button", { type: "button", "data-tab": tab, onclick: open }, label));
    $("tabs-bottom").append(el("button", { type: "button", "data-tab": tab, onclick: open }, el("span", { class: "nav-icon" }, icon(mark)), label));
  }
  $("lock").addEventListener("click", openAccess);
  renderLock();
  window.addEventListener("hashchange", route);
  wideScreen.addEventListener("change", () => { if (activeTab === "repo" && repoView) renderRepo(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && activeTab !== "settings") refreshActive(); });
  const quiet = () => !document.hidden && !document.querySelector("dialog[open]");
  // Background refresh, but never while a dialog is open or something is being typed.
  setInterval(() => {
    const typing = document.activeElement && ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName);
    if (quiet() && !typing && activeTab !== "settings") refreshActive();
  }, REFRESH_MS);
  // While an agent works, what it is doing is followed closely; this touches nothing that is typed in.
  setInterval(async () => {
    if (!quiet()) return;
    if (activeTab === "repo") pollRepo();
    else if (activeTab === "overview" && working.length && !inFlight) {
      const before = working.length;
      await fetchWorking();
      renderNow();
      if (working.length < before) load();
    }
  }, LIVE_MS);
  route();
})();
</script>
</body>
