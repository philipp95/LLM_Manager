<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#13282D">
<meta name="referrer" content="no-referrer">
<title>LLM Manager</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
  /*
   * Harbor: deep-water background, sand-paper tiles, rust for actions, teal as the quiet second colour.
   * Text on paper uses --ink / --ink-2 (12.2:1 / 5.7:1); status colours have darker "-ink" steps for text.
   */
  :root {
    --harbor: #13282D; --harbor-2: #1B353B; --harbor-3: #24434A; --harbor-line: #2C4B52;
    --on-harbor: #EDE3D1; --on-harbor-2: #A9BDBD;
    --paper: #F1E7D6; --paper-2: #E7DAC3; --paper-3: #D9C9AD; --paper-line: #D8C9AE; --field: #FBF6EC;
    --ink: #2B2621; --ink-2: #625850; --ink-3: #857A6E;
    --rust: #D2733A; --rust-strong: #A9501F; --rust-on-dark: #E58B4F; --teal: #3E7F86; --teal-ink: #2D5F64;
    --ok: #4F8A5B; --ok-ink: #34623E; --warn: #C9962E; --warn-ink: #7A5810; --bad: #B8483B; --bad-ink: #9C3A2F;
    /* Chart series, validated as a categorical set on --paper (light): agents keep fixed hues everywhere. */
    --claude: #C25E28; --codex: #2B5DA8; --gemini: #A23B72; --commits: #3E7F86;
    --radius: 18px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 1px 0 rgba(0, 0, 0, .22), 0 10px 26px rgba(0, 0, 0, .26);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--on-harbor);
    background: radial-gradient(140% 55% at 50% -12%, #21434A 0%, transparent 62%), var(--harbor);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  svg.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.logo { width: 18px; height: 18px; flex: none; fill: currentColor; }

  /* ---------- header and navigation ---------- */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px 12px;
    padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    background: rgba(19, 40, 45, .9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--harbor-line);
  }
  .brand-mark { width: 34px; height: 34px; flex: none; display: block; }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .title .status { font-size: 12px; color: var(--on-harbor-2); }
  body.offline .title .status { color: #F0A496; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; cursor: pointer;
    color: var(--on-harbor); background: var(--harbor-2); border: 1px solid var(--harbor-line);
  }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn.unlocked { color: #8CC59A; }
  .spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .tabs { display: none; gap: 4px; padding: 3px; border-radius: 12px; background: var(--harbor-2); border: 1px solid var(--harbor-line); }
  .tabs button {
    display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px;
    background: transparent; color: var(--on-harbor-2); font-size: 14px; font-weight: 650; cursor: pointer;
  }
  .tabs button[aria-current="page"] { background: var(--paper); color: var(--ink); }
  .tabs-bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    background: rgba(19, 40, 45, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--harbor-line);
  }
  .tabs-bottom button {
    display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 5px 2px; border: 0; border-radius: 14px;
    background: transparent; color: var(--on-harbor-2); font-size: 11.5px; font-weight: 650; cursor: pointer;
  }
  .tabs-bottom button svg.icon { width: 22px; height: 22px; padding: 0; box-sizing: content-box; }
  .tabs-bottom button .nav-icon { display: grid; place-items: center; width: 56px; height: 28px; border-radius: 999px; }
  .tabs-bottom button[aria-current="page"] { color: var(--on-harbor); }
  .tabs-bottom button[aria-current="page"] .nav-icon { background: var(--rust-strong); color: #FFF8EE; }

  main { max-width: 1120px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .tab { display: grid; gap: 14px; min-width: 0; }
  #tab-schedule, #tab-usage, #tab-settings { max-width: 760px; margin: 0 auto; width: 100%; }
  @media (min-width: 720px) {
    .tabs { display: flex; }
    .tabs-bottom { display: none; }
    main { padding-bottom: 48px; }
  }

  /* ---------- paper surfaces ---------- */
  .panel, .card, .list-card, dialog { background: var(--paper); color: var(--ink); color-scheme: light; }
  .panel { border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .panel h2, .panel-head h2 { margin: 0; font-size: 12px; font-weight: 750; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .panel-sub { font-size: 12.5px; color: var(--ink-2); }
  .muted { color: var(--ink-2); font-size: 13px; }

  /* ---------- home: working now, repository cards ---------- */
  .now { display: grid; gap: 8px; }
  .now-row {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; cursor: pointer;
    border-radius: 14px; background: var(--harbor-2); border: 1px solid var(--harbor-line); color: var(--on-harbor); min-width: 0;
  }
  .now-row:focus-visible { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  .now-row .agent-mark { color: var(--on-harbor); }
  .now-text { flex: 1; min-width: 0; display: grid; }
  .now-text b { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-text span { font-size: 12px; color: var(--on-harbor-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots { display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: dot 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  .now-row .dots { color: var(--rust-on-dark); }
  .now-row > svg.icon { color: var(--on-harbor-2); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .grid > :not(.card) { grid-column: 1 / -1; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }
  .card {
    position: relative; border-radius: 22px; padding: 18px 18px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: transform .15s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card.pinned { box-shadow: var(--shadow), inset 0 0 0 2px var(--rust); }
  .card-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .card-id { flex: 1; min-width: 0; }
  .card-name { margin: 0; font-size: 21px; line-height: 1.15; font-weight: 750; letter-spacing: -.015em; overflow-wrap: anywhere; }
  .card-open { all: unset; cursor: pointer; }
  .card-open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .card-open:focus-visible::after { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  .card-owner { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-desc {
    margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); min-height: 2.9em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-desc.missing { font-style: italic; }
  .card-cells { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; border-top: 1px solid var(--paper-line); padding-top: 10px; }
  .card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--paper-line); padding-top: 8px; }
  .card-foot .grow { flex: 1; }
  .card .pin, .stars, .card-link { position: relative; z-index: 1; }
  .pin {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--paper-line); background: var(--field); color: var(--ink-2);
    display: grid; place-items: center; flex: none; cursor: pointer;
  }
  .pin svg.icon { width: 19px; height: 19px; }
  .pin.on { background: var(--rust-strong); border-color: transparent; color: #FFF8EE; }
  .pin.on svg.icon { fill: currentColor; }
  .stars { display: inline-flex; margin-left: -8px; }
  .stars button { width: 40px; height: 44px; border: 0; background: transparent; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; border-radius: 10px; }
  .stars button svg.icon { width: 24px; height: 24px; stroke-width: 1.8; }
  .stars button.on { color: var(--rust-strong); }
  .stars button.on svg.icon { fill: currentColor; }
  .stars button:active svg.icon { transform: scale(.88); }
  .card-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; font-size: 13px; font-weight: 700; color: var(--rust-strong); text-decoration: none; }
  .card-link svg.icon { width: 14px; height: 14px; }
  .badge { width: 30px; height: 30px; border-radius: 9px; background: var(--paper-2); color: var(--ink); display: grid; place-items: center; flex: none; }
  .badge.big { width: 46px; height: 46px; border-radius: 13px; }
  .badge.big svg.logo, .badge.big svg.icon { width: 26px; height: 26px; }
  .badge .letters { font-size: 10px; font-weight: 800; letter-spacing: .02em; }
  .badge.big .letters { font-size: 13px; }
  .cell { display: grid; gap: 4px; min-width: 0; align-content: start; }
  .cell > * { min-width: 0; }
  .cell-label { font-size: 10.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
  .cell-note { font-size: 13px; color: var(--ink-2); }
  .pr-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .pr-num { font-weight: 750; font-variant-numeric: tabular-nums; font-size: 14px; }
  .pr-title { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who {
    width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 8.5px; font-weight: 800; letter-spacing: .02em;
    display: inline-grid; place-items: center; flex: none; text-transform: uppercase;
  }
  .agent-mark { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; color: var(--ink); }
  .agent-mark svg.logo { width: 17px; height: 17px; }
  .agent-mark svg.icon { width: 17px; height: 17px; stroke-width: 2.4; }
  .ci { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; color: #fff; }
  .ci svg.icon { width: 11px; height: 11px; stroke-width: 3.2; }
  .ci.success { background: var(--ok); } .ci.failure { background: var(--bad); } .ci.pending { background: var(--warn); }
  .week { display: flex; gap: 16px; }
  .week b { display: block; font-size: 22px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .week span { font-size: 11.5px; color: var(--ink-2); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 750; padding: 2px 8px; border-radius: 999px; background: rgba(62, 127, 134, .16); color: var(--teal-ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: pulse 2s ease-in-out infinite; }

  .add-form { display: grid; gap: 10px; }
  .add-form .inline { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-form .input { flex: 1 1 240px; width: auto; min-height: 44px; }
  .add-form .small-btn { min-height: 44px; }
  .clone-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .clone-row b { font-weight: 650; }
  .server-entry {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; min-width: 0;
    border-radius: var(--radius); border: 1px dashed var(--rust-on-dark); background: rgba(210, 115, 58, .08); color: var(--on-harbor);
  }
  .server-entry:focus-visible { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  .server-entry .badge { background: var(--harbor-3); color: var(--rust-on-dark); }
  .server-entry div { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .server-entry b { font-size: 15px; }
  .server-entry span { font-size: 12.5px; color: var(--on-harbor-2); }
  .on-dark { color: var(--on-harbor-2); }
  #now-slot:empty, #home-head:empty, #add-slot:empty, #server-slot:empty, #app-slot:empty { display: none; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); max-width: 100%; min-width: 0;
    background: var(--paper-2); border: 1px solid var(--paper-line); border-radius: 999px; padding: 3px 9px; text-decoration: none;
  }
  .chip svg.icon { width: 13px; height: 13px; }
  .chip svg.logo { width: 13px; height: 13px; }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.mono .t { font-family: var(--mono); }
  .chip.ok { color: var(--ok-ink); background: rgba(79, 138, 91, .14); border-color: rgba(79, 138, 91, .35); }
  .chip.warn { color: var(--warn-ink); background: rgba(201, 150, 46, .18); border-color: rgba(201, 150, 46, .45); }
  .chip.bad { color: var(--bad-ink); background: rgba(184, 72, 59, .12); border-color: rgba(184, 72, 59, .35); }
  .chip.running, .chip.live { color: var(--teal-ink); background: rgba(62, 127, 134, .16); border-color: rgba(62, 127, 134, .4); }
  .chip.running svg.icon { animation: spin 1.2s linear infinite; }
  .chip.agent { color: var(--ink); }

  /* ---------- repository: sessions and conversation ---------- */
  .back { all: unset; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--on-harbor); font-weight: 650; cursor: pointer; padding: 0 6px 0 2px; justify-self: start; border-radius: 10px; }
  .back:focus-visible { outline: 3px solid var(--rust-on-dark); }
  .repo-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .repo-top .badge { background: var(--harbor-3); color: var(--on-harbor); }
  .repo-top.server .badge { color: var(--rust-on-dark); }
  .repo-id { flex: 1; min-width: 0; }
  .repo-id h1 { margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -.015em; overflow-wrap: anywhere; }
  .repo-id div { font-size: 13px; color: var(--on-harbor-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repo-top .icon-btn { text-decoration: none; }
  .subtabs { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--harbor-2); border: 1px solid var(--harbor-line); justify-self: start; max-width: 100%; overflow-x: auto; }
  .subtabs button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--on-harbor-2); font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .subtabs button[aria-current="page"] { background: var(--paper); color: var(--ink); }
  .subtabs button .count { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 5px; }
  .repo-desc { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; }
  .repo-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .repo-stats div { background: var(--paper-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
  .repo-stats b { display: block; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .repo-stats span { font-size: 11.5px; color: var(--ink-2); }
  .repo-head .chips { margin-top: 12px; }
  .repo-part { display: grid; gap: 14px; min-width: 0; }
  .server-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--rust-on-dark); background: rgba(210, 115, 58, .08); color: var(--on-harbor); font-size: 13px; }
  .server-note svg.icon { color: var(--rust-on-dark); margin-top: 2px; }

  .chat-layout { display: grid; gap: 16px; min-width: 0; align-items: start; }
  .session-col, .chat-col { display: grid; gap: 10px; min-width: 0; }
  .chat-col { min-height: calc(100vh - 240px); min-height: calc(100dvh - 240px); grid-template-rows: auto auto 1fr auto; }
  @media (max-width: 899px) {
    body:not(.in-chat) .chat-col { display: none; }
    body.in-chat .session-col, body.in-chat .repo-top, body.in-chat .subtabs, body.in-chat .server-note { display: none; }
    body.in-chat .tabs-bottom { display: none; }
    body.in-chat main { padding-bottom: 0; }
    body.in-chat .chat-col { min-height: calc(100vh - 96px); min-height: calc(100dvh - 96px); }
  }
  @media (min-width: 900px) {
    .chat-layout { grid-template-columns: 320px minmax(0, 1fr); }
    .session-col { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 2px; }
    .chat-head .back { display: none; }
  }
  /* The sessions as a tree: main is the rail on the left, each session's branch forks off it,
     carries a dot per message and, once merged, bends back into main. Newest on top. */
  .tree { display: grid; min-width: 0; }
  .tree-row { display: grid; grid-template-columns: 46px minmax(0, 1fr); min-width: 0; }
  .tree.flat .tree-row { grid-template-columns: minmax(0, 1fr); }
  .tree.flat .lane { display: none; }
  .tree-row > :last-child { margin: 5px 0; min-width: 0; }
  .lane { position: relative; display: flex; flex-direction: column; color: var(--on-harbor-2); }
  .lane::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--rail); }
  .tree { --rail: #5F8088; }
  .lane svg { display: block; width: 46px; height: 22px; flex: none; position: relative; overflow: visible; }
  .lane path, .lane circle { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .lane circle.solid { fill: currentColor; }
  .lane circle.hole { fill: var(--harbor); }
  .lane-mid { flex: 1; position: relative; display: flex; flex-direction: column-reverse; justify-content: space-evenly; align-items: flex-start; gap: 3px; min-height: 12px; }
  .lane-mid::before { content: ""; position: absolute; left: 32px; top: 0; bottom: 0; width: 2px; background: currentColor; }
  .lane-mid i { position: relative; width: 10px; height: 10px; margin-left: 28px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px var(--harbor); flex: none; }
  .lane-mid i.bad { background: #E07A6C; }
  .lane-mid i.run { background: var(--harbor); border: 2px solid currentColor; box-sizing: border-box; animation: pulse 1.4s ease-in-out infinite; }
  .lane-mid b { position: relative; margin-left: 22px; padding: 0 2px; min-width: 22px; text-align: center; font-size: 10px; font-weight: 750; line-height: 14px; color: currentColor; background: var(--harbor); font-variant-numeric: tabular-nums; }
  .lane.open, .lane.new { color: var(--rust-on-dark); }
  .lane.merged { color: #8CC59A; }
  .lane.closed, .lane.new { --dash: 3 5; }
  .lane.closed path, .lane.new path { stroke-dasharray: var(--dash); }
  .lane.closed .lane-mid::before, .lane.new .lane-mid::before { background: repeating-linear-gradient(currentColor 0 3px, transparent 3px 8px); }
  .lane.on path, .lane.on circle { stroke-width: 3; }
  .lane.on .lane-mid::before { width: 4px; left: 31px; }
  .lane.head::before { top: 50%; }
  .lane.head i, .lane.knot i { position: absolute; left: 5px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--rail); box-shadow: 0 0 0 3px var(--harbor); }
  .lane.knot i { background: var(--harbor); border: 2px solid var(--rail); box-sizing: border-box; }
  .lane.foot { height: 16px; }
  .lane.foot::before { background: linear-gradient(var(--rail), transparent); }
  .tree-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 34px; color: var(--on-harbor-2); font-size: 12.5px; }
  .tree-main .chip { background: var(--harbor-2); border-color: var(--harbor-line); color: var(--on-harbor); }
  .tree-fold {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 12px; cursor: pointer;
    color: var(--on-harbor); font-size: 13.5px; font-weight: 700; background: var(--harbor-2); border: 1px solid var(--harbor-line);
  }
  .tree-fold:focus-visible { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  .tree-fold span { flex: 1; } .tree-fold small { font-weight: 500; color: var(--on-harbor-2); font-size: 12px; }
  .tree-fold svg.icon { transition: transform .15s; } .tree-fold[aria-expanded="true"] svg.icon:last-child { transform: rotate(90deg); }
  .new-session {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--rust-strong); color: #FFF8EE; font-weight: 750; font-size: 15px;
  }
  .new-session[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #FFF8EE; }
  .session {
    all: unset; box-sizing: border-box; display: grid; gap: 5px; padding: 11px 13px; border-radius: 14px; cursor: pointer; min-width: 0; min-height: 56px;
    background: var(--paper); color: var(--ink); color-scheme: light; box-shadow: var(--shadow);
  }
  .session.merged, .session.closed { background: var(--paper-2); box-shadow: none; }
  .session[aria-pressed="true"] { box-shadow: var(--shadow), inset 0 0 0 2px var(--rust); }
  .session:focus-visible { outline: 3px solid var(--rust-on-dark); outline-offset: 2px; }
  .session-top { display: flex; align-items: center; gap: 7px; min-width: 0; font-weight: 700; font-size: 14.5px; }
  .session-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-branch { display: flex; align-items: center; gap: 5px; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .session-branch svg.icon { width: 13px; height: 13px; flex: none; }
  .session-branch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .session-meta { display: flex; gap: 4px 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); min-width: 0; }
  .session-meta .chip { min-height: 22px; font-size: 11.5px; padding: 0 7px; }
  .session-col .more { justify-self: start; }
  .session-col .hint { margin: 4px 2px; font-size: 13px; color: var(--on-harbor-2); }

  /* Merging, always in reach: the bar stays under the header while the conversation scrolls. */
  .merge-slot { position: sticky; top: calc(var(--header-h, 66px) + 8px); z-index: 3; min-width: 0; }
  .merge-slot:empty { margin-top: -10px; }
  .merge-bar {
    display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 10px 10px 14px; border-radius: 16px; min-width: 0;
    background: var(--paper); color: var(--ink); color-scheme: light; box-shadow: 0 10px 26px rgba(4, 16, 19, .45); border-left: 6px solid var(--paper-3);
  }
  .merge-bar.open { border-left-color: var(--teal); } .merge-bar.ok { border-left-color: var(--ok); }
  .merge-bar.bad { border-left-color: var(--bad); } .merge-bar.warn { border-left-color: var(--warn); }
  .merge-info { flex: 1 1 170px; min-width: 0; display: grid; gap: 4px; }
  .merge-title { display: flex; align-items: center; gap: 7px; font-weight: 750; font-size: 15px; min-width: 0; }
  .merge-title a { color: inherit; text-underline-offset: 3px; }
  .merge-title svg.icon { flex: none; }
  .merge-detail { display: flex; gap: 5px 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .merge-btn {
    flex: 0 0 auto; min-height: 48px; padding: 0 22px; border-radius: 13px; border: 2px solid transparent; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 750;
    background: var(--rust-strong); color: #FFF8EE;
  }
  .merge-btn.careful { background: var(--field); border-color: var(--bad); color: var(--bad-ink); }
  .merge-btn.quiet { background: var(--field); border-color: var(--paper-line); color: var(--ink); font-size: 14.5px; }
  .merge-btn:disabled { opacity: .55; cursor: default; }
  .merge-btn.working svg.icon { animation: spin 1.2s linear infinite; }
  .merge-error { flex: 1 0 100%; display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--bad-ink); font-weight: 600; overflow-wrap: anywhere; }
  .merge-error svg.icon { flex: none; margin-top: 2px; }
  @media (max-width: 420px) { .merge-btn { flex: 1 1 100%; } }

  .chat-head { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
  .chat-head h2 { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 17px; line-height: 1.25; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-head .chip { background: var(--harbor-2); border-color: var(--harbor-line); color: var(--on-harbor); }
  .chat-head .chip.ok { color: #8CC59A; } .chat-head .chip.running { color: #8FC7CD; } .chat-head .chip.warn { color: #E5C06A; }
  .thread { display: grid; gap: 12px; align-content: end; min-width: 0; }
  .thread-empty { align-self: center; justify-self: center; max-width: 440px; text-align: center; color: var(--on-harbor-2); font-size: 14px; display: grid; gap: 10px; justify-items: center; padding: 24px 8px; }
  .thread-empty .badge { background: var(--harbor-3); color: var(--rust-on-dark); }
  .thread-empty b { color: var(--on-harbor); font-size: 17px; }
  .earlier { justify-self: center; font-size: 12.5px; color: var(--on-harbor-2); }
  .bubble { border-radius: 18px; padding: 11px 14px; overflow-wrap: anywhere; min-width: 0; }
  .bubble .text { white-space: pre-wrap; font-size: 14.5px; }
  .bubble.me { justify-self: end; max-width: min(86%, 620px); background: var(--harbor-3); color: var(--on-harbor); border-bottom-right-radius: 6px; }
  .bubble.me .meta { color: var(--on-harbor-2); text-align: right; font-size: 11.5px; margin-top: 2px; }
  .bubble.agent { justify-self: start; width: min(94%, 680px); background: var(--paper); color: var(--ink); color-scheme: light; border-bottom-left-radius: 6px; display: grid; gap: 8px; box-shadow: var(--shadow); }
  .bubble .who-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 750; font-size: 13.5px; }
  .bubble .who-row .grow { flex: 1; }
  .bubble .who-row .meta { font-weight: 500; }
  .bubble .err { color: var(--bad-ink); font-size: 13px; white-space: pre-wrap; }
  .bubble .foot { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .bubble .foot .meta { flex: 1 1 auto; font-size: 11.5px; }
  .more-text { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--rust-strong); min-height: 32px; display: inline-flex; align-items: center; }
  .bubble.me .more-text { color: var(--rust-on-dark); }
  .working { display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--paper-2); }
  .working-top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; color: var(--teal-ink); }
  .working-top .time { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .activity { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
  .activity li { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
  .activity li span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .activity li svg.icon { width: 12px; height: 12px; margin-top: 3px; }
  .activity .a-tool span { font-family: var(--mono); font-size: 12px; }
  .activity .a-error { color: var(--bad-ink); }
  .activity li:last-child { color: var(--ink); }
  .stages { display: flex; gap: 4px; flex-wrap: wrap; }
  .stage { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--paper-2); color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
  .stage svg.icon { width: 11px; height: 11px; stroke-width: 3; }
  .stage.done { color: var(--ok-ink); } .stage.failed { color: var(--bad-ink); } .stage.active { color: var(--teal-ink); }
  .stage.active svg.icon { animation: spin 1.2s linear infinite; }
  .attach-more summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); min-height: 32px; display: inline-flex; align-items: center; gap: 6px; }
  .attach-more p { margin: 4px 0 6px; font-size: 12.5px; color: var(--ink-2); }

  .composer {
    position: sticky; bottom: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0;
    margin: 0 -8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--paper); color: var(--ink); color-scheme: light; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 24px rgba(0, 0, 0, .28);
  }
  @media (min-width: 900px) { .composer { margin: 0; bottom: 12px; border-radius: 20px; padding-bottom: 10px; } }
  .composer-opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .agent-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .agent-pick button, .opt {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--paper-line); background: var(--field); color: var(--ink); font-size: 13.5px; font-weight: 650;
  }
  .agent-pick button .agent-mark { color: inherit; }
  .agent-pick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .opt { color: var(--ink-2); padding-left: 11px; }
  .opt[aria-pressed="true"] { background: rgba(62, 127, 134, .16); border-color: var(--teal); color: var(--teal-ink); }
  .opt svg.icon { width: 14px; height: 14px; }
  .composer select.opt { flex: 0 1 auto; min-width: 0; max-width: min(100%, 230px); appearance: auto; padding-right: 6px; }
  .composer-main { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-width: 0; min-height: 46px; max-height: 40vh; resize: none; border-radius: 16px; border: 1px solid var(--paper-line);
    background: var(--field); color: var(--ink); padding: 11px 13px; font: inherit; font-size: 16px; line-height: 1.4;
  }
  .toggle { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); flex: 1 1 220px; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--rust-strong); margin: 1px 0 0; flex: none; }
  .send {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%;
    background: var(--rust-strong); color: #FFF8EE; cursor: pointer;
  }
  .send svg.icon { width: 20px; height: 20px; stroke-width: 2.4; }
  .send:disabled { opacity: .5; cursor: default; }
  .send:active:not(:disabled) { transform: scale(.94); }
  .composer-hint { margin: 0; font-size: 12px; color: var(--ink-2); }
  .thread.intro { align-content: center; }
  @media (max-width: 899px) { body.in-chat #tab-repo > .back { display: none; } }

  .wt { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 12px; padding: 12px 0; border-top: 1px solid var(--paper-line); }
  .wt > * { min-width: 0; }
  .wt:first-child { border-top: 0; padding-top: 2px; }
  .bar { border-radius: 4px; background: var(--paper-3); grid-row: span 3; }
  .bar.ok { background: var(--ok); } .bar.warn { background: var(--warn); } .bar.bad { background: var(--bad); }
  .bar.live { background: var(--teal); animation: pulse 2s ease-in-out infinite; }
  .wt-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .branch { font-family: var(--mono); font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wt-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 5px; }
  .wt-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .wt-meta svg.icon { width: 12px; height: 12px; }
  .wt .chips { padding-top: 6px; }
  .attach { margin-top: 8px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; background: var(--harbor); border-radius: 10px; }
  .attach code { font-family: var(--mono); font-size: 12.5px; color: #9FD3D8; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
  .attach button { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--harbor-line); background: var(--harbor-2); color: var(--on-harbor); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .ended { margin-top: 6px; font-size: 12px; color: var(--ink-2); }
  .publish { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .publish .note { font-size: 12px; color: var(--ink-2); flex-basis: 100%; }
  .codex-start { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--paper-line); }
  .codex-start .muted { flex: 1 1 200px; }

  .pr-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--paper-line); color: inherit; text-decoration: none; }
  .pr-row:first-child { border-top: 0; padding-top: 2px; }
  .state { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .state svg.icon { width: 14px; height: 14px; }
  .state.merged { background: var(--teal); } .state.open { background: var(--ok); } .state.closed { background: var(--ink-3); }
  .pr-head { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .pr-name { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-meta { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-tags { display: flex; gap: 5px; align-items: center; }
  .notice { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: rgba(201, 150, 46, .16); color: var(--warn-ink); overflow-wrap: anywhere; }
  .notice svg.icon { margin-top: 2px; }
  .panel details summary { cursor: pointer; list-style: none; font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .panel details summary::-webkit-details-marker { display: none; }
  .paths { display: grid; gap: 6px; margin-top: 10px; }
  .paths div { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .paths div b { font-family: system-ui, sans-serif; font-weight: 700; color: var(--ink); margin-right: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

  .devices { margin: 4px 0 12px; }
  .device { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--paper-line); }
  .device:first-child { border-top: 0; }
  .device div { flex: 1; min-width: 0; }
  .device b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device span { font-size: 12.5px; color: var(--ink-2); }
  dialog a { color: var(--rust-strong); font-weight: 650; }

  /* ---------- buttons and lists ---------- */
  .small-btn {
    min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--paper-line); background: var(--field); color: var(--ink);
    font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none;
  }
  .small-btn.danger { color: var(--bad-ink); }
  .small-btn.go { background: var(--rust-strong); border-color: transparent; color: #FFF8EE; font-weight: 650; }
  .small-btn:disabled { opacity: .55; cursor: default; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .section-head h2 { margin: 0; font-size: 12px; font-weight: 750; color: var(--on-harbor-2); text-transform: uppercase; letter-spacing: .08em; }
  .list-card { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .item { padding: 12px 14px; border-top: 1px solid var(--paper-line); display: grid; gap: 6px; }
  .item:first-child { border-top: 0; }
  .item .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item .name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .meta.with-icon { display: flex; gap: 6px; align-items: flex-start; }
  .meta.with-icon svg.icon { width: 13px; height: 13px; margin-top: 2px; }
  .err { font-size: 12.5px; color: var(--bad-ink); overflow-wrap: anywhere; }
  .actions-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .list-card .empty { padding: 22px 14px; color: var(--ink-2); }
  .empty, .error { text-align: center; color: var(--on-harbor-2); padding: 40px 16px; }
  .error strong { color: #F0A496; display: block; margin-bottom: 6px; font-size: 16px; }
  .panel .error { color: var(--ink-2); padding: 24px 8px; } .panel .error strong { color: var(--bad-ink); }
  .hint-text { font-size: 12.5px; color: var(--ink-2); }
  .sandbox-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .app-banner {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); text-decoration: none;
    color: var(--on-harbor); background: var(--harbor-2); border: 1px solid var(--harbor-line);
  }
  .app-banner div { flex: 1; min-width: 0; }
  .app-banner b { display: block; font-size: 15px; }
  .app-banner span { font-size: 12px; color: var(--on-harbor-2); }

  /* ---------- charts and meters (on paper) ---------- */
  .hero { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 2px; }
  .hero b { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .hero span { color: var(--ink-2); font-size: 13px; }
  .readout { font-size: 12.5px; color: var(--ink-2); min-height: 18px; margin-bottom: 6px; }
  .readout strong { color: var(--ink); font-weight: 650; }
  .chart { width: 100%; display: block; touch-action: pan-y; }
  .chart text { fill: var(--ink-2); font-size: 10px; font-family: system-ui, sans-serif; }
  .chart .hl { fill: rgba(43, 38, 33, .07); }
  .section { margin-top: 18px; }
  .section h3 { margin: 0 0 4px; font-size: 14px; font-weight: 650; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 2px 0 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .rank { display: grid; grid-template-columns: minmax(0, 38%) 1fr auto; gap: 6px 10px; align-items: center; margin-top: 8px; }
  .rank .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .track { height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .rank .fill { height: 100%; border-radius: 999px; background: var(--commits); }
  .rank .v { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
  .table-wrap { max-height: 260px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--paper-line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-2); font-weight: 650; position: sticky; top: 0; background: var(--paper); }
  .panel .table-details { margin-top: 10px; }
  .panel .table-details summary { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600; padding: 6px 0; }
  .meter-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .meter { height: 10px; border-radius: 999px; overflow: hidden; background: var(--paper-2); }
  .meter > div { height: 100%; border-radius: 999px; }
  .meter-row .v { font-variant-numeric: tabular-nums; font-weight: 650; }
  .meter-row .r { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); margin-top: -4px; }
  .agent-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 750; }
  .agent-title i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ---------- dialogs ---------- */
  dialog { border: 0; border-radius: 18px; padding: 18px; width: min(420px, calc(100% - 28px)); box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
  dialog::backdrop { background: rgba(8, 18, 20, .72); }
  dialog.sheet { width: min(560px, calc(100% - 20px)); max-height: calc(100vh - 40px); overflow: auto; }
  dialog h2 { margin: 0 0 6px; font-size: 17px; }
  dialog p { margin: 0 0 12px; color: var(--ink-2); font-size: 13.5px; }
  dialog code { font-family: var(--mono); font-size: 12px; color: var(--teal-ink); overflow-wrap: anywhere; }

  .days button { flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid var(--paper-line); background: var(--field); color: var(--ink-2); font-size: 12.5px; cursor: pointer; }

  .input, .panel select {
    width: 100%; min-height: 42px; border-radius: 11px; border: 1px solid var(--paper-line); background: var(--field); color: var(--ink);

  .settings-form { display: grid; gap: 4px; }
  .settings-form .field:first-child { margin-top: 0; }
  .field small { font-size: 12px; color: var(--ink-2); }
  .setting-row { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--paper-line); min-width: 0; }
  .setting-row:first-child { border-top: 0; padding-top: 0; }

  const fmtDay = (iso, opts) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString([], opts || { month: "short", day: "numeric" }); };
  const niceMax = (v) => { if (v <= 4) return Math.max(v, 1); const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return v; };

    for (const [label, size] of [["y", 31536000], ["mo", 2592000], ["d", 86400], ["h", 3600], ["m", 60]]) {

  // ---------- token ----------
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (_) { return ""; } }
  function setToken(value) { try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch (_) { /* private mode */ } }

  function askToken() {

  /** Not paired and no (valid) token: say why, and offer the token and the open app download. */

      el("p", { class: "muted" }, refused

      el("div", { class: "actions-row" },
        el("button", { class: "small-btn go", type: "button", onclick: async () => { if (await askToken()) refreshActive(); } }, icon("lock"), "Enter token"),
        el("a", { class: "small-btn", href: "/download/llm-manager.apk", download: "llm-manager.apk" }, icon("download"), "Android app")));
  }

  /** Who has access: the paired devices (revocable), the token as a fallback, and the Android app. */
  async function openAccess() {
    const dialog = $("access-dialog");
    const list = el("div", { class: "devices" }, el("p", { class: "muted" }, "Loading…"));
    const app = lastApp && typeof lastApp.url === "string" && lastApp.url.startsWith("/download/") ? lastApp : null;
    const useToken = async () => {
      dialog.close();
      if (await askToken()) { toast("Token saved"); refreshActive(); }
    };
    const forget = () => {
      setToken("");
      renderLock();
      dialog.close();
      toast("Forgotten in this browser");
    };
    dialog.replaceChildren(...[
      el("div", { class: "section-head" }, el("h2", null, "Access"),
        el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
      el("p", null, "Devices signed in to the same Tailscale account as the server pair themselves: each gets its own token, " +
        "which only works from that device. Revoking one makes it pair again; to lock a device out, remove it from your Tailscale account."),
      list,
      el("div", { class: "actions-row" },
        el("button", { class: "small-btn", type: "button", onclick: useToken }, icon("lock"), "Use the access token"),
        getToken() ? el("button", { class: "small-btn danger", type: "button", onclick: forget }, icon("x"), "Forget in this browser") : null),
      app ? el("p", { class: "hint-text" }, "Android app " + (app.versionName ? "version " + app.versionName : "") + " · ",
        el("a", { href: app.url, download: "llm-manager.apk" }, "download")) : null,
    ].filter(Boolean));
    dialog.showModal();
    if (!(await ensureAccess())) {
      list.replaceChildren(el("p", { class: "muted" }, "This browser is not paired. " + (pairRefusal || "There is no access token") + "."));
      return;
    }
    const result = await api("/api/devices", { prompt: false });
    if (result.status === 404) { list.replaceChildren(el("p", { class: "muted" }, "Pairing is off on this server; devices use the access token.")); return; }
    if (!result.ok) { list.replaceChildren(el("p", { class: "muted" }, result.body.error || "Could not load devices (" + result.status + ")")); return; }
    const devices = result.body.devices || [];
    const row = (d) => el("div", { class: "device" },
      el("div", null, el("b", null, d.name),
        el("span", null, (d.client === "app" ? "Android app" : "Browser") + (d.os ? " · " + d.os : "") + " · last seen " + relative(d.lastSeenAt || d.pairedAt))),
      d.current ? chip("this browser", "ok", "check")
        : el("button", { class: "small-btn danger", type: "button", onclick: async () => {
            const revoked = await api("/api/devices/" + encodeURIComponent(d.id) + "/revoke", { method: "POST" });
            toast(revoked.ok ? "Revoked " + d.name : (revoked.body.error || "Failed"), !revoked.ok);

  /**
   * Pairs this browser when the server recognises it, through Tailscale, as one of its owner's
   * devices: the server then hands out a token for this browser alone. Concurrent callers share
   * one attempt. False, with the reason in `pairRefusal`, when the server says no.
   */
  function pair() {
    if (!pairing) {
      pairing = (async () => {
        try {
          const response = await fetch("/api/pair", {
            method: "POST", cache: "no-store",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ client: "web" }),
          });
          const body = await response.json().catch(() => ({}));
          if (response.ok && typeof body.token === "string") {
            setToken(body.token);
            pairRefusal = "";
            renderLock();
            return true;
          }
          pairRefusal = body.error || "Pairing is not available (" + response.status + ")";
          return false;
        } catch (error) {
          pairRefusal = "The server could not be reached (" + error.message + ")";
          return false;
        } finally {
          pairing = null;
        }
      })();
    }
    return pairing;
  }

  /** A token to use: the saved one, or a new one from pairing. */
  async function ensureAccess() {
    return !!getToken() || await pair();
  }

  /**
   * Authenticated JSON request to this origin. Without a token it pairs first; on 401 (a token
   * revoked or replaced) it pairs again, and only then asks for the access token, unless
   * `prompt: false` (background refreshes must never pop a dialog).
   */
  async function api(path, options) {
    const { prompt = true, ...init } = options || {};
    await ensureAccess();
    const send = () => fetch(path, Object.assign({ cache: "no-store" }, init, {
      headers: Object.assign({ Accept: "application/json", Authorization: "Bearer " + getToken() }, init.headers || {}),
    }));
    let response = await send();
    if (response.status === 401) {
      setToken("");
      renderLock();
      if (await pair() || (prompt && await askToken())) response = await send();
    }
    const type = response.headers.get("Content-Type") || "";
    const json = type.includes("application/json");
    const body = json ? await response.json().catch(() => ({})) : {};
    return { ok: response.ok, status: response.status, body, json };
  }

  const postJson = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  // navigator.clipboard needs a secure context, which plain http over the tailnet is not.
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => false);
    const area = el("textarea", { readonly: true, style: "position:fixed;opacity:0" }, text);
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
    area.remove();
    return Promise.resolve(ok);
  }

  // ---------- repository tiles ----------
  function latestCell(p) {
    const ins = p.insights;
    if (!p.forge) return el("div", { class: "cell-note" }, "Local repository");

  }

  /** Pins a repository or gives it stars: shown at once, then saved on the server, which orders the list. */
  async function prefer(p, change) {
    const next = { pinned: change.pinned === undefined ? !!p.pinned : change.pinned, stars: change.stars === undefined ? p.stars || 0 : change.stars };
    Object.assign(p, next);
    projectsCache = projectsCache.map((x, i) => [x, i])
      .sort((a, b) => (b[0].pinned ? 1 : 0) - (a[0].pinned ? 1 : 0) || (b[0].stars || 0) - (a[0].stars || 0) || a[1] - b[1]).map((x) => x[0]);

        { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next) });

    } catch (error) {
      toast("Can't reach the server: " + error.message, true);

  }

  /** Sessions an agent is working on right now, across repositories; a tap opens the conversation. */

  /** Adding a repository: paste its address; the server clones it in the background. */
  function renderAdd() {
    const head = $("home-head"), slot = $("add-slot");
    head.replaceChildren(el("div", { class: "section-head" }, el("h2", null, "Repositories"),
      canClone ? el("button", { class: "small-btn go", type: "button", "aria-expanded": String(addOpen), onclick: () => { addOpen = !addOpen; renderAdd(); if (addOpen) $("add-url").focus(); } },
        icon(addOpen ? "x" : "plus"), addOpen ? "Close" : "Add repository") : null));
    const recent = clones.filter((c) => c.state !== "done" || addOpen);
    if (!addOpen && !recent.length) { slot.replaceChildren(); return; }
    let form = null;
    if (addOpen) {
      const url = el("input", { class: "input", id: "add-url", type: "url", inputmode: "url", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
        placeholder: "https://github.com/owner/repository", "aria-label": "Repository address" });
      const add = el("button", { class: "small-btn go", type: "button" }, icon("download"), "Add");
      const submit = async () => {
        const value = url.value.trim();
        if (!value) { url.focus(); return; }
        add.disabled = true;
        try {
          const result = await postJson("/api/projects/clone", { url: value });
          if (!result.ok) { toast(result.body.error || "Failed (" + result.status + ")", true); return; }
          toast("Adding " + (result.body.name || "the repository") + "…");

    }

  /** Follows the repositories being added until none is left; a finished one reloads the list. */
  async function watchClones() {
    clearTimeout(cloneTimer);
    try {
      const result = await api("/api/projects/clones", { prompt: false });
      if (!result.ok || !result.json) return;
      const before = clones.filter((c) => c.state === "cloning").map((c) => c.id);
      clones = result.body.clones || [];
      const finished = clones.some((c) => before.includes(c.id) && c.state !== "cloning");
      renderAdd();
      if (finished) load();
      if (clones.some((c) => c.state === "cloning")) cloneTimer = setTimeout(watchClones, 2000);
    } catch (_) { /* the next refresh tries again */ }
  }

  function renderHome() {
    renderNow();
    renderAdd();
    grid.replaceChildren(...(projectsCache.length
      ? projectsCache.map(card)
      : [el("div", { class: "empty" }, "No git repositories found in the configured folders." + (canClone ? " Add one with its address." : ""))]));
    $("server-slot").replaceChildren(...(serverChat ? [el("button", { class: "server-entry", type: "button", onclick: () => go("server") },
      el("span", { class: "badge big" }, icon("terminal")),
      el("div", null, el("b", null, "Server chat"), el("span", null, "Change this server itself: its setup, tools and LLM Manager's own backend. Not tied to a repository, and not sandboxed.")),
      icon("chevron"))] : []));
  }

  function renderAppBanner(app) {
    const slot = $("app-slot");
    if (!app || typeof app.url !== "string" || !app.url.startsWith("/download/")) { slot.replaceChildren(); return; }
    const mb = (app.sizeBytes / 1048576).toFixed(1);
    slot.replaceChildren(el("a", { class: "app-banner", href: app.url, download: "llm-manager.apk" },
      el("img", { class: "brand-mark", src: "/logo.png", alt: "" }),
      el("div", null, el("b", null, "Get the Android app"),
        el("span", null, (app.versionName ? "Version " + app.versionName + " · " : "") + mb + " MB · built " + relative(app.builtAt))),
      icon("link")));
  }

  function applyProjects(body) {
    lastApp = body.androidApp || null;
    codexAvailable = body.codexAvailable === true;
    projectsCache = body.projects;
    lastAnalytics = body.analytics || null;
    canClone = body.canClone === true;
    serverChat = body.serverChat === true;
    renderAppBanner(body.androidApp);
  }

  async function fetchProjects() {
    const result = await api("/api/projects", { prompt: false });
    if (result.status === 401) return { locked: true };
    // A captive portal answers 200 with HTML; only trust a JSON body of the expected shape.
    if (!result.ok || !result.json) throw new Error("Unexpected response (" + result.status + ")");
    if (!result.body || !Array.isArray(result.body.projects)) throw new Error("Unexpected response shape");
    applyProjects(result.body);
    return { body: result.body };
  }

  async function load() {
    if (inFlight) return;
    if (!(await ensureAccess())) { clearHome(); grid.replaceChildren(lockedPanel(false)); return; }
    inFlight = true;
    spin(true);
    try {
      const [result] = await Promise.all([fetchProjects(), fetchWorking()]);
      if (result.locked) { clearHome(); grid.replaceChildren(lockedPanel(true)); return; }
      const projects = result.body.projects;
      renderHome();
      if (!cloneTimer) watchClones();
      // Pull request activity is read in the background on the server; look again shortly.
      if (projects.some((p) => p.forge && !p.insights) && insightRetries < 3) {
        insightRetries++;
        setTimeout(() => { if (activeTab === "overview") load(); }, 4000);
      }
      stamp();
    } catch (error) {
      clearHome();
      grid.replaceChildren(el("div", { class: "error" }, el("strong", null, "Can't reach the server"), "Is Tailscale connected? " + error.message));
      offline();
    } finally {
      inFlight = false;
      spin(false);
    }

  function stageChip(run) {

  function runStatus(run) {

  /** Opens the session's pull request, or merges it: at once, through the forge, which still applies its own rules. */

  /**

      title: s.busy ? "Wait until the agent is done" : null, onclick: () => sessionAction(p, s, action),
    }, icon(working ? "loader" : name), working ? during : label);

  /**

      picker.replaceChildren(...ok.map((a) => el("button", {
        type: "button", "aria-pressed": String(a === state.agent),
        onclick: () => { state.agent = a; saveAgent(a); render(); },
      }, agentMark(a), AGENT[a].pick)));

      const chosen = branchSelect.value;
      branchSelect.replaceChildren(el("option", { value: "" }, "A new branch (recommended)"),
        ...shareable.map((x) => el("option", { value: x.id, selected: x.id === chosen }, "Same branch as “" + clamp(x.title, 40) + "” (" + x.branch + ")")));
      branchSelect.hidden = !!s || !shareable.length;
      const shared = !s && branchSelect.value ? shareable.find((x) => x.id === branchSelect.value) : null;

  async function loadRepo() {

      ]);

      if (projects.locked) { dropRepoView(); repoTab.replaceChildren(lockedPanel(true)); return; }
      if (schedule && schedule.ok && schedule.json) scheduleData = schedule.body;
      if (chats && chats.ok && chats.json) chatData = { projectId: id, chats: chats.body.chats || [] };

        dropRepoView();

          el("button", { class: "back", type: "button", onclick: () => go("") }, icon("back"), "All repositories"),

  /** While an agent works: the sessions, and the last steps of the run on screen, every few seconds. */
  async function pollRepo() {
    const id = currentRepo;
    if (polling || !repoView || repoView.id !== id || !chatData || chatData.projectId !== id || !chatData.chats.some((c) => c.busy)) return;
    polling = true;
    try {
      const chats = await api("/api/projects/" + encodeURIComponent(id) + "/chats", { prompt: false });
      if (id !== currentRepo || !chats.ok || !chats.json) return;
      chatData = { projectId: id, chats: chats.body.chats || [] };
      const session = chatData.chats.find((c) => c.id === repoRoute.chat);
      const run = session ? sessionState(session) : null;
      if (run && run.status === "running") {
        const log = await api("/api/runs/" + encodeURIComponent(run.id) + "/log?tail=4", { prompt: false });
        if (id !== currentRepo) return;
        if (log.ok && log.json) liveLog = { runId: run.id, lines: log.body.activity || [] };
      }
      // Done: branches and pull requests have changed too.

      renderRepo();
      stamp();

  // ---------- navigation ----------
  function go(hash) {
    if (location.hash.replace(/^#/, "") === hash) route();
    else location.hash = hash;
  }

  function route() {
    const hash = location.hash.replace(/^#/, "");
    if (activeTab === "overview") gridScroll = window.scrollY;
    const match = /^(?:repo\/([^/]+)|(server))(?:\/(new|prs|branches|s\/([^/]+)))?$/.exec(hash);
    if (match) {
      const id = match[2] ? ServerProject.id : match[1];
      const same = activeTab === "repo" && currentRepo === id && repoView && repoView.id === id;
      currentRepo = id;
      repoRoute = { view: match[3] === "prs" || match[3] === "branches" ? match[3] : "sessions", chat: match[3] === "new" ? "new" : match[4] || null };
      liveLog = null;
      if (same) {
        // Within a repository: show what is known at once, then look for news.
        renderRepo(true);
        loadRepo();
        return;
      }
      dropRepoView();
      showTab("repo");
      window.scrollTo(0, 0);
      return;
    }
    currentRepo = null;
    dropRepoView();
    const tab = ["schedule", "usage", "settings"].includes(hash) ? hash : "overview";
    showTab(tab);
    window.scrollTo(0, tab === "overview" ? gridScroll : 0);
  }

  function showTab(name) {

    for (const button of document.querySelectorAll("[data-tab]")) {
      if (button.dataset.tab === selected) button.setAttribute("aria-current", "page"); else button.removeAttribute("aria-current");
    }
    for (const tab of ["overview", "repo", "schedule", "usage", "settings"]) $("tab-" + tab).hidden = tab !== name;
    refreshActive();
  }

  function refreshActive() {
    if (activeTab === "repo") return loadRepo();
    if (activeTab === "schedule") return loadSchedule();
    if (activeTab === "usage") return loadUsage();
    if (activeTab === "settings") return loadSettings();
    return load();
  }

    codex: {

      key: "An OpenAI API key (platform.openai.com → API keys). Usage is then billed to the API account, not to ChatGPT.",
    },
    gemini: {
      account: "your Google account",
      code: "Allow access, then copy the authorization code and paste it here. Gemini waits five minutes for it.",
      key: "A Gemini API key from Google AI Studio (aistudio.google.com → Get API key).",
    },
  };
  const LIVE_STATES = ["starting", "waiting", "checking"];

  /**
   * The sign-in pop-up for an agent's CLI on the server. The CLI's own sign-in runs there; this
   * shows its link (and Codex's code), and hands the code from the sign-in page back to it.
   * Resolves true once the agent is signed in.
   */
  function openSignIn(agent) {
    return new Promise((resolve) => {
      const dialog = $("signin-dialog");
      const label = AGENT[agent].pick, help = SIGN_IN[agent];
      const content = el("div");
      let view = { state: "starting", screen: [] }, timer = 0, signedIn = false, keyForm = false, note = "";
      const path = "/api/settings/agents/" + agent + "/sign-in";

      async function call(method, suffix, payload) {
        clearTimeout(timer);
        try {
          const init = payload === undefined ? { method } : { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) };
          const result = await api(path + (suffix || ""), init);
          view = result.ok && result.json ? result.body : { state: "failed", message: result.body.error || "Failed (" + result.status + ")", screen: [] };
        } catch (error) {
          view = { state: "failed", message: "Can't reach the server: " + error.message, screen: [] };
        }
        if (dialog.open) render();
      }

      function codeStep() {
        const input = el("input", { class: "input mono", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "Paste the code" });
        const go = el("button", { class: "small-btn go", type: "button" }, icon("check"), "Continue");
        const submit = async () => {
          const code = input.value.trim();
          if (!code) { input.focus(); return; }
          go.disabled = true;
          await call("POST", "/code", { code });
        };
        go.addEventListener("click", submit);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        setTimeout(() => input.focus(), 0);
        return el("div", { class: "inline" }, input, go);
      }

      function steps() {
        const url = httpsOnly(view.url);
        const open = url
          ? el("a", { class: "small-btn go", href: url, target: "_blank", rel: "noopener noreferrer" }, icon("link"), "Open the sign-in page")
          : el("span", { class: "meta" }, "Waiting for the link…");
        const items = [el("li", null, el("div", null, el("span", null, "Open the sign-in page and sign in with " + help.account + "."), open))];
        if (view.userCode) {
          const copyCode = el("button", { class: "small-btn", type: "button", onclick: async () => toast(await copy(view.userCode) ? "Code copied" : "Copy failed; select the code", false) }, icon("copy"), "Copy");
          items.push(el("li", null, el("div", null, el("span", null, "Enter this code on that page:"), el("div", { class: "inline" }, el("span", { class: "device-code" }, view.userCode), copyCode))));
          items.push(el("li", null, el("div", null, el("span", null, "Come back here: this window notices by itself when you're signed in."))));
        } else if (help.code) {
          items.push(el("li", null, el("div", null, el("span", null, help.code), view.needsCode ? codeStep() : el("span", { class: "meta" }, view.state === "checking" ? "Checking the code…" : "Waiting for " + AGENT[agent].label + "…"))));
        }
        return el("ol", { class: "steps" }, items);
      }

      function keyStep() {
        const input = el("input", { class: "input mono", type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "Paste the API key" });
        const save = el("button", { class: "small-btn go", type: "button" }, icon("check"), "Use this key");
        save.addEventListener("click", async () => {
          if (!input.value.trim()) { input.focus(); return; }
          save.disabled = true;
          const result = await api("/api/settings/agents/" + agent + "/api-key", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: input.value.trim() }) });
          save.disabled = false;
          if (!result.ok) { note = result.body.error || "Failed (" + result.status + ")"; render(); return; }
          if (LIVE_STATES.includes(view.state)) await api(path, { method: "DELETE" }).catch(() => null);
          view = { state: "done", message: "Signed in with an API key", screen: [] };
          render();
        });
        setTimeout(() => input.focus(), 0);
        return el("div", { class: "token-form" }, el("span", { class: "hint-text" }, help.key), el("div", { class: "inline" }, input, save),
          el("div", { class: "actions-row" }, el("button", { class: "small-btn", type: "button", onclick: () => { keyForm = false; note = ""; render(); } }, icon("back"), "Back to signing in")));
      }

      function render() {
        const live = LIVE_STATES.includes(view.state);
        const screen = view.screen && view.screen.length
          ? el("details", { open: view.state === "failed" }, el("summary", null, "What " + AGENT[agent].label + " printed"), el("pre", { class: "screen" }, view.screen.join("\n")))
          : null;
        let body;
        if (view.state === "done") {
          signedIn = true;
          body = [el("div", { class: "signin-status" }, chip(view.message || "Signed in", "ok", "check"))];
          setTimeout(() => { if (dialog.open) dialog.close(); }, 1400);
        } else if (keyForm) {
          body = [keyStep()];
        } else if (view.state === "failed" || view.state === "idle") {
          body = [
            el("div", { class: "signin-status" }, chip(view.state === "idle" ? "No sign-in running" : "Not signed in", view.state === "idle" ? null : "bad", "alert"),
              view.message ? el("span", null, view.message) : null),
            screen,
            el("div", { class: "actions-row" }, el("button", { class: "small-btn go", type: "button", onclick: () => call("POST", "", { restart: true }) }, icon("refresh"), "Try again")),
          ];
        } else {
          body = [
            view.state === "starting" ? el("div", { class: "signin-status" }, chip("Starting the sign-in on the server…", "running", "loader")) : steps(),
            view.message && view.state === "waiting" ? el("p", { class: "err" }, view.message) : null,
            screen,
          ];
        }
        // replaceChildren would show null as the text "null", unlike el().
        content.replaceChildren(...[
          ...body,
          note ? el("p", { class: "err" }, note) : null,
          el("div", { class: "actions-row" },
            help.key && !keyForm && view.state !== "done" ? el("button", { class: "small-btn", type: "button", onclick: () => { keyForm = true; render(); } }, icon("key"), "Use an API key instead") : null,
            live && !keyForm ? el("button", { class: "small-btn", type: "button", onclick: () => call("POST", "", { restart: true }) }, icon("refresh"), "New link") : null,
            live ? el("button", { class: "small-btn danger", type: "button", onclick: async () => { await call("DELETE"); dialog.close(); } }, icon("x"), "Cancel sign-in") : null),
        ].filter(Boolean));
        clearTimeout(timer);
        if (live && dialog.open) timer = setTimeout(() => call("GET"), view.state === "starting" ? 700 : 2000);
      }

      dialog.replaceChildren(
        el("div", { class: "section-head" }, el("h2", null, "Sign in to " + label),
          el("button", { class: "small-btn", type: "button", onclick: () => dialog.close() }, icon("x"), "Close")),
        el("p", null, "This signs in the " + AGENT[agent].label + " CLI on the server, the way it signs in on a computer. Your password goes only to the sign-in page."),
        content);
      dialog.addEventListener("close", () => { clearTimeout(timer); resolve(signedIn); }, { once: true });
      dialog.showModal();
      render();
      call("POST", "", {});
    });
  }

  async function loadSettings() {
    if (!(await ensureAccess())) { settingsTab.replaceChildren(lockedPanel(false)); return; }
    spin(true);
    try {
      const result = await api("/api/settings");
      if (result.status === 404) { settingsTab.replaceChildren(el("div", { class: "panel" }, el("p", { class: "muted" }, "This server has no settings yet; update it."))); return; }
      if (!result.ok) throw new Error(result.body.error || "Failed (" + result.status + ")");
      renderSettings(result.body);
      stamp();
    } catch (error) {
      settingsTab.replaceChildren(el("div", { class: "error" }, el("strong", null, "Couldn't load the settings"), error.message));
    } finally {
      spin(false);
    }
  }

  /** Sends one change; the server answers with the whole settings page, shown again. */
  async function changeSettings(path, method, payload, button) {
    if (button) button.disabled = true;
    try {
      const init = payload === undefined ? { method } : { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) };
      const result = await api(path, init);
      if (!result.ok) { toast(result.body.error || "Failed (" + result.status + ")", true); return false; }
      toast(result.body.message || "Saved");
      if (activeTab === "settings") renderSettings(result.body);
      return true;
    } catch (error) {
      toast("Can't reach the server: " + error.message, true);
      return false;
    } finally {
      if (button) button.disabled = false;
    }
  }

  const field = (label, input, note) => el("label", { class: "field" }, el("span", null, label), input, note ? el("small", null, note) : null);
  const textInput = (value, attrs) => el("input", Object.assign({ class: "input", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false" }, attrs, { value: value || "" }));

  function profilePanel(data) {
    const name = textInput(data.profile.name, { autocomplete: "name", autocapitalize: "words", maxlength: "80", placeholder: "Your name" });
    const email = textInput(data.profile.email, { type: "email", autocomplete: "email", maxlength: "120", placeholder: "you@example.com" });
    const offered = data.agents.filter((a) => a.installed && a.enabled);

      el("option", { value: "" }, "The last one used on each device"),

    const save = el("button", { class: "small-btn go", type: "button" }, icon("check"), "Save profile");
    save.addEventListener("click", async () => {
      const defaultAgent = agent.value || null;
      const saved = await changeSettings("/api/settings/profile", "PUT", { name: name.value.trim(), email: email.value.trim(), defaultAgent }, save);
      if (saved && defaultAgent) saveAgent(defaultAgent);

    return el("div", { class: "panel settings-form" },
      field("Name", name),

      field("Agent in the chat", agent),
      el("div", { class: "actions-row" }, save));
  }

  function agentRow(a) {
    const name = AGENT[a.agent].pick;
    const status = !a.installed ? chip("Not installed", "warn", "alert")
      : a.signedIn ? chip("Signed in" + (a.method ? " · " + a.method : ""), "ok", "check")
      : chip("Not signed in", "bad", "alert");

      return el("div", { class: "setting-row" }, el("div", { class: "row-head" }, agentMark(a.agent), el("b", null, name), el("span", { class: "grow" }), status),
        el("p", { class: "muted" }, "Install the " + AGENT[a.agent].label + " CLI on the server to use it."));
    }

  /** A code host: its status, and a token form opened on demand. Tokens are sent once and never shown again. */
  function forgeRow(f, title, mark, options) {
    const status = options.adds ? null : f.connected ? chip(f.account ? "Signed in as " + f.account : "Connected", "ok", "check") : chip("Not connected", null, "alert");
    const token = el("input", { class: "input mono", type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "Paste the token" });
    const extra = options.fields || [];
    const connect = el("button", { class: "small-btn go", type: "button" }, icon("check"), "Check and save");
    const form = el("div", { class: "token-form", hidden: true }, ...extra.map((x) => x.node), token,
      el("small", { class: "hint-text" }, options.help, options.link ? [" ", el("a", { href: options.link, target: "_blank", rel: "noopener noreferrer" }, "Create one")] : null),
      el("div", { class: "actions-row" }, connect, el("button", { class: "small-btn", type: "button", onclick: () => { form.hidden = true; } }, "Cancel")));

  // ---------- schedule ----------
  function describeSchedule(job) {
    const sc = job.schedule;
    if (sc.at) return job.done ? "Ran " + fmtTime(job.lastFiredAt || sc.at) : "Once · " + fmtTime(sc.at);
    const days = sc.days && sc.days.length && sc.days.length < 7
      ? (sc.days.join() === "1,2,3,4,5" ? "Mon–Fri" : sc.days.map((d) => DAY_NAMES[d - 1]).join(" "))
      : "every day";
    const here = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return "Daily " + sc.time + " · " + days + (sc.zone && sc.zone !== here ? " (" + sc.zone + ")" : "");
  }

  const agentChip = (agent, prefix) => el("span", { class: "chip agent" }, agentMark(agent), el("span", { class: "t" }, (prefix || "") + AGENT[agent].label));
