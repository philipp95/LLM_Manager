name: Build and check

# Pull requests get one run per change; pushes are checked again once they land on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      # Kotlin compiles inside the Gradle process: a separate Kotlin daemon outlives the build and,
      # on Windows, can hold the step's output open so the step never ends (jobs hung until the
      # timeout). The output goes to a file for the same reason and is printed when the build ends.
      - name: Compile, test, analyze, and package
        shell: bash
        timeout-minutes: 15
        run: |
          status=0
          bash ./gradlew check :server:spike:installDist :server:api:installDist --no-daemon --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process > build.log 2>&1 || status=$?
          cat build.log
          exit $status
      # Job logs need a GitHub sign-in on public repositories; annotations show on the pull request.
      - name: Show failures as annotations
        if: failure() || cancelled()
        shell: bash
        run: bash .github/scripts/annotate-failures.sh build.log "${{ job.status }}"
